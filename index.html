<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Héliarque">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25' r='75%25'%3E%3Cstop offset='0' stop-color='%2300E5FF'/%3E%3Cstop offset='.55' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%230B1B36'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='20' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='32' rx='30' ry='8' fill='none' stroke='%2300E5FF' stroke-width='3' transform='rotate(-20 32 32)'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Héliarque</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jeu de stratégie spatiale par navigateur : bâtissez une station autour d’une étoile mourante.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{
  /* Mise en page : interface de jeu compacte pour mobile. Fond spatial vivant (nébuleuse assombrie, grain, lignes de balayage), plaques de coque biseautées aux bords lumineux, lignes de 76 px avec compte à rebours circulaire, bandeau de lancement, célébration de fin de chantier. Thème sombre unique, par choix. */
  --void:#04070D;
  --sky:#0A1422;
  --hud:#060E18;
  --card:#0C1929;
  --card-2:#122438;
  --card-3:#1B3350;
  --line:#1D3A5E;
  --edge:rgba(79,163,255,.30);
  --edge-hi:#5FB0FF;
  --ink:#E4EDF8;
  --ink-2:#9DABBD;
  --ink-3:#6E7C8F;
  --vesper:#3B82F6;
  --vesper-2:#00E5FF;
  --on-accent:#03101E;
  --on-medal:#08111D;
  --ore:#B9C2CE;
  --ice:#00E5FF;
  --data:#B583FF;
  --energy:#F59E0B;
  --pop:#22C55E;
  --danger:#EF4444;
  --ok:#22C55E;
  --star:rgba(255,255,255,.6);
  --hl:rgba(255,255,255,.34);
  --shade:rgba(10,8,30,.28);
  --scrim:rgba(2,5,10,.72);
  --shadow:rgba(0,0,0,.6);
  --f-hud:"Rajdhani","Exo 2",system-ui,sans-serif;
  --f-body:"Exo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:var(--f-hud);
  --noise:none;
  --nav-h:60px;
  --cut:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hud)}
h1,h2,h3,h4{font-family:var(--f-hud);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation}
input{font:inherit}
.muted{color:var(--ink-3)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--vesper-2);outline-offset:2px}
.ri{width:14px;height:14px;flex:none;color:var(--c);fill:currentColor}
.hud-k{font-family:var(--f-hud);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--vesper-2)}

/* ---------- fond spatial ---------- */
.backdrop{position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 50% -10%,rgba(59,130,246,.22),transparent 55%),radial-gradient(ellipse at 50% 120%,rgba(0,229,255,.08),transparent 50%),linear-gradient(rgba(4,7,13,.74),rgba(4,7,13,.9)),var(--img-carina,none) center/cover,var(--void)}
.backdrop::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),var(--noise);background-size:auto,160px 160px;opacity:.9}

/* ---------- plaques de coque ---------- */
.row,.panel,.quest,.stat2,.alert,.note,.segs,.launch,.cel-card,.busybox,.cbars{position:relative;background:var(--noise),linear-gradient(180deg,rgba(28,56,92,.55),rgba(9,18,31,.9) 58%),var(--card);background-size:160px 160px,auto,auto;border:1px solid var(--edge);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));box-shadow:inset 0 1px 0 rgba(170,215,255,.14),inset 0 0 24px rgba(0,0,0,.5)}
.row::before,.panel::before,.quest::before,.stat2::before,.segs::before,.launch::before,.cel-card::before,.busybox::before,.cbars::before{content:"";position:absolute;inset:-1px;pointer-events:none;z-index:2;background:linear-gradient(135deg,transparent 0 6.4px,var(--edge-hi) 6.4px 7.6px,transparent 7.6px) top left/var(--cut) var(--cut) no-repeat,linear-gradient(-45deg,transparent 0 6.4px,var(--edge-hi) 6.4px 7.6px,transparent 7.6px) bottom right/var(--cut) var(--cut) no-repeat,linear-gradient(var(--edge-hi),var(--edge-hi)) top right/16px 2px no-repeat,linear-gradient(var(--edge-hi),var(--edge-hi)) top right/2px 10px no-repeat,linear-gradient(var(--edge-hi),var(--edge-hi)) bottom left/16px 2px no-repeat,linear-gradient(var(--edge-hi),var(--edge-hi)) bottom left/2px 10px no-repeat;opacity:.55}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,rgba(6,14,24,.97),rgba(6,14,24,.9));border-bottom:1px solid var(--edge);box-shadow:0 1px 0 rgba(0,229,255,.12),0 8px 24px rgba(0,0,0,.45)}
.top-in{display:flex;align-items:center;gap:4px;padding-block:6px}
.res{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;min-width:0}
.r{appearance:none;border:0;background:linear-gradient(180deg,rgba(27,51,80,.6),rgba(9,18,31,.6));color:var(--ink);padding:5px 5px 4px;display:grid;gap:3px;min-width:0;cursor:pointer;text-align:left;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);box-shadow:inset 0 0 0 1px rgba(79,163,255,.18);--c:var(--ink-2)}
.r:active{filter:brightness(1.3)}
.r .top2{display:flex;align-items:center;gap:4px;min-width:0}
.r .v{font-family:var(--f-hud);font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px color-mix(in oklab,var(--c) 45%,transparent)}
.r .meter{height:2px;background:rgba(255,255,255,.08);overflow:hidden}
.r .meter i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 6px var(--c);transition:width .8s linear}
.r.nometer .meter{visibility:hidden}
.r.full .v{color:var(--energy)}
.r.warn .v{color:var(--danger)}
.r.flash-neg{animation:flashNeg .7s ease-out}
.r.flash-pos{animation:flashPos .7s ease-out}
@keyframes flashNeg{0%{background:rgba(239,68,68,.45)}}
@keyframes flashPos{0%{background:rgba(34,197,94,.4)}}
.floater{position:fixed;z-index:70;transform:translate(-50%,0);font-family:var(--f-hud);font-weight:700;font-size:14px;pointer-events:none;white-space:nowrap;animation:floatDown 1.3s ease-out forwards;text-shadow:0 1px 3px #000}
.floater.neg{color:#FF8A8A}
.floater.pos{color:#5BE38A}
@keyframes floatDown{0%{opacity:0;transform:translate(-50%,-4px) scale(.9)}15%{opacity:1;transform:translate(-50%,2px) scale(1.08)}100%{opacity:0;transform:translate(-50%,26px) scale(1)}}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:7px}
.strip::-webkit-scrollbar{display:none}
.strip:empty{display:none}
.chipx{appearance:none;flex:none;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px 0 3px;border:0;background:linear-gradient(180deg,rgba(27,51,80,.8),rgba(9,18,31,.9));color:var(--ink);font-family:var(--f-hud);font-size:13.5px;font-weight:700;cursor:pointer;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 45%,transparent);--c:var(--vesper-2)}
.chipx .cth{width:28px;height:28px;overflow:hidden;flex:none;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.chipx .cth img{width:100%;height:100%;object-fit:cover;display:block}
.chipx .cth img:not([src]){visibility:hidden}
.chipx svg{width:16px;height:16px;fill:none;stroke:var(--c);stroke-width:1.9;margin-left:7px}
.chipx .cl{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink-2)}
.chipx b{color:var(--c);text-shadow:0 0 8px color-mix(in oklab,var(--c) 60%,transparent)}
.chipx .cbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06)}
.chipx .cbar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 6px var(--c)}
.chipx.raid{background:linear-gradient(180deg,rgba(120,20,20,.85),rgba(40,8,10,.9));--c:#FF7A7A;padding-left:10px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--danger));box-shadow:0 0 8px var(--c,var(--danger))}
.chipx.raid .dot,.alert.raid .dot{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- écrans ---------- */
.app{padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:9px;min-width:0}
.vh{display:flex;align-items:center;gap:10px;min-width:0;padding:2px 0 4px;border-bottom:1px solid var(--edge);background:linear-gradient(90deg,var(--vesper-2),transparent 40%) bottom left/100% 1px no-repeat}
.vh h1{font-size:25px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 18px rgba(0,229,255,.25)}
.vh span{margin-left:auto;font-family:var(--f-hud);font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);white-space:nowrap}
.gear{appearance:none;flex:none;width:36px;height:36px;margin-right:-6px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.segs{display:flex;gap:3px;padding:3px;--cut:8px}
.segs button{appearance:none;flex:1;border:0;background:none;color:var(--ink-3);font-family:var(--f-hud);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;min-height:36px;cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.segs button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(59,130,246,.45),rgba(29,78,160,.35));color:var(--ink);box-shadow:inset 0 -2px 0 var(--vesper-2);text-shadow:0 0 10px rgba(0,229,255,.5)}
.quest{appearance:none;width:100%;border:0;text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;color:var(--ink);background:var(--noise),linear-gradient(100deg,rgba(59,130,246,.42),rgba(12,25,41,.92) 70%),var(--card);background-size:160px 160px,auto,auto}
.quest-k{font-family:var(--f-hud);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--vesper-2)}
.quest-t{font-family:var(--f-hud);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:1}
.quest-d{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:1}
.quest-go{grid-row:1 / span 3;grid-column:2;font-family:var(--f-hud);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:linear-gradient(180deg,#5BE6FF,#2E86F0);padding:7px 10px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
#alerts{display:grid;gap:6px}
#alerts:empty{display:none}
.alert{appearance:none;width:100%;border:0;text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px;padding:9px 12px;color:var(--ink);font-size:13px;--cut:7px;background:var(--noise),linear-gradient(90deg,color-mix(in oklab,var(--c) 30%,transparent),rgba(9,18,31,.92) 70%),var(--card);background-size:160px 160px,auto,auto}
.alert b{font-weight:700;color:var(--c)}
.note{font-size:13.5px;color:var(--ink-2);padding:10px 12px}
.empty{color:var(--ink-3);font-size:13.5px}
.hint-s{font-size:12.5px;color:var(--ink-3);text-align:center}
.sub-h{font-family:var(--f-hud);font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;color:var(--ink-2)}
.view.enter .row,.view.enter .quest,.view.enter .map-wrap,.view.enter .panel{animation:rowIn .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(-14px)}}

/* ---------- lignes ---------- */
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:8px;min-width:0;--c:var(--ink-2)}
.row.busy{border-color:color-mix(in oklab,var(--vesper-2) 70%,transparent);background:repeating-linear-gradient(-45deg,rgba(0,229,255,.07) 0 10px,transparent 10px 20px),var(--noise),linear-gradient(180deg,rgba(20,70,110,.6),rgba(9,18,31,.92) 60%),var(--card);background-size:28px 28px,160px 160px,auto,auto;animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:28px 0,0 0,0 0,0 0}}
.row.busy::before{opacity:1;filter:drop-shadow(0 0 4px var(--vesper-2))}
.row.obj{border-color:color-mix(in oklab,var(--energy) 70%,transparent)}
.row-main{appearance:none;border:0;background:none;color:inherit;padding:0;display:flex;align-items:center;gap:11px;flex:1;min-width:0;text-align:left;cursor:pointer}
.rthumb{position:relative;width:58px;height:58px;flex:none;overflow:hidden;background:linear-gradient(180deg,var(--card-2),var(--void));clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 45%,transparent)}
.rthumb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);pointer-events:none}
.rthumb img,.rthumb svg{width:100%;height:100%;display:block;object-fit:cover}
.rthumb img:not([src]){visibility:hidden}
.rlv{position:absolute;right:2px;bottom:2px;z-index:1;min-width:20px;height:17px;padding:0 5px;background:rgba(3,8,15,.88);font-family:var(--f-hud);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 70%,transparent)}
.tring{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(3,8,15,.55)}
.tring svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);transform:rotate(-90deg)}
.tr-bg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:3}
.tr-fg{fill:none;stroke:var(--vesper-2);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 3px var(--vesper-2))}
.tring b{position:relative;font-family:var(--f-hud);font-size:13px;font-weight:700;color:#fff;text-shadow:0 0 6px var(--vesper-2)}
.rtext{display:grid;gap:1px;min-width:0}
.rname{display:flex;align-items:center;gap:6px;font-family:var(--f-hud);font-size:17px;font-weight:700;letter-spacing:.01em;min-width:0}
.rname > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lchip{flex:none;font-family:var(--f-hud);font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--vesper-2);padding:0 5px;background:rgba(0,229,255,.1);box-shadow:inset 0 0 0 1px rgba(0,229,255,.3)}
.lchip i{font-style:normal;margin:0 2px;color:var(--ink-3)}
.lchip.max{color:var(--ok);background:rgba(34,197,94,.12);box-shadow:inset 0 0 0 1px rgba(34,197,94,.4)}
.obj-tag{flex:none;font-family:var(--f-hud);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#1A0F00;background:var(--energy);padding:0 5px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.rsub{font-size:12.5px;font-weight:600;color:color-mix(in oklab,var(--c) 60%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub.busy-t{color:var(--vesper-2)}
.row.locked .rsub{color:var(--ink-3);font-weight:500}
.row.locked .rthumb img{filter:grayscale(.85) brightness(.5)}
.row.locked .rname{color:var(--ink-2)}
.rcost{display:flex;gap:9px;font-family:var(--f-hud);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.cm{display:inline-flex;align-items:center;gap:3px}
.cm .ri{width:11px;height:11px}
.cm.short{color:#FF7A7A}
.up{appearance:none;flex:none;position:relative;min-width:78px;height:54px;padding:0 6px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:linear-gradient(180deg,#1C3452,#0B1626);color:var(--ink-3);font-family:var(--f-hud);cursor:pointer;white-space:nowrap;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:inset 0 0 0 1px rgba(79,163,255,.25)}
.up .up-l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.up .up-t{font-size:14px;font-weight:700}
.up.go{background:linear-gradient(180deg,#5BE6FF 0%,#2E86F0 55%,#1E5FD0 100%);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.25)}
.up.go::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%) -120% 0/250% 100% no-repeat;animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{60%,100%{background-position:120% 0}}
.up:active:not(:disabled){transform:scale(.95);filter:brightness(1.2)}
.up.soft{color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.up:disabled{cursor:not-allowed}
.act-lock,.act-done{flex:none;width:54px;height:54px;display:grid;place-items:center;color:var(--ink-3);font-weight:800}
.act-lock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.act-done{color:var(--ok);font-family:var(--f-hud);font-size:13px;letter-spacing:.1em}
.rbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vesper),var(--vesper-2));box-shadow:0 0 8px var(--vesper-2)}

/* ---------- éléments partagés ---------- */
.panel{padding:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.panel-h h3{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;background:rgba(0,229,255,.08);box-shadow:inset 0 0 0 1px rgba(0,229,255,.25);font-family:var(--f-hud);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.jobs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.job{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;--c:var(--vesper)}
.mini{width:32px;height:32px;display:grid;place-items:center;background:color-mix(in oklab,var(--c) 22%,var(--card-2));clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.mini svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.job-main{min-width:0;display:grid;gap:5px}
.job-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.job-n{font-family:var(--f-hud);font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.job-n .muted{font-weight:500}
.eta{font-family:var(--f-hud);font-weight:700;font-size:15px;white-space:nowrap;color:var(--vesper-2)}
.eta.muted{color:var(--ink-3);font-weight:500}
.bar{height:5px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vesper),var(--vesper-2));box-shadow:0 0 8px var(--vesper-2)}
.x{appearance:none;width:32px;height:32px;border:0;background:rgba(239,68,68,.12);color:#FF8A8A;cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:rgba(12,25,41,.85);box-shadow:inset 0 0 0 1px var(--edge);font-family:var(--f-hud);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip b{color:var(--ink)}
.duo2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat2{display:grid;gap:1px;padding:10px 12px}
.stat2 span{font-family:var(--f-hud);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.stat2 b{font-family:var(--f-hud);font-size:26px;font-weight:700}
.medal{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,color-mix(in oklab,var(--c) 50%,white) 0%,var(--c) 50%,color-mix(in oklab,var(--c) 55%,var(--void)) 100%)}
.medal svg{width:21px;height:21px;fill:none;stroke:var(--on-medal);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.desc{color:var(--ink-2);font-size:13.5px}
.gain{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;padding:10px 12px;background:linear-gradient(90deg,rgba(0,229,255,.08),transparent);box-shadow:inset 2px 0 0 var(--vesper-2)}
.gain .from{font-family:var(--f-hud);color:var(--ink-3);font-weight:700;font-size:17px;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.gain .arrow{color:var(--vesper-2);font-weight:700}
.gain .to{font-family:var(--f-hud);font-weight:700;font-size:26px;line-height:1;color:var(--vesper-2);text-shadow:0 0 14px rgba(0,229,255,.45)}
.gain .unit{color:var(--ink-2);font-size:13px}
.gain small{flex-basis:100%;color:var(--ink-3);font-size:12px;margin-top:3px}
.done-note{color:var(--ok);font-weight:700}
.req{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.req .pill.ok{color:var(--ok)}
.req .pill.no{color:#FFB4B4;background:rgba(239,68,68,.14);box-shadow:inset 0 0 0 1px rgba(239,68,68,.45)}
.price{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cost,.dur{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;background:rgba(12,25,41,.85);box-shadow:inset 0 0 0 1px var(--edge);font-family:var(--f-hud);font-size:14.5px;font-weight:700;color:var(--ink);--c:var(--ink-2)}
.cost.short{color:#FF8A8A;box-shadow:inset 0 0 0 1px rgba(239,68,68,.6)}
.dur{color:var(--ink-2);font-weight:600;--c:var(--ink-3);background:transparent;box-shadow:none;padding-left:2px}
.wait{font-family:var(--f-hud);font-size:13.5px;font-weight:600;color:var(--energy);text-align:center;margin-top:-4px}
.wait:empty{display:none}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;gap:5px;align-items:baseline;padding:3px 9px;background:rgba(12,25,41,.85);box-shadow:inset 0 0 0 1px var(--edge);font-family:var(--f-hud);font-size:13.5px;font-weight:600;color:var(--ink-3)}
.stat b{color:var(--ink);font-weight:700}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.quick{display:flex;gap:5px}
.chipbtn{appearance:none;flex:1;min-height:40px;padding:0 11px;background:linear-gradient(180deg,#1C3452,#0B1626);border:0;color:var(--ink);font-family:var(--f-hud);font-size:14.5px;font-weight:700;letter-spacing:.04em;cursor:pointer;white-space:nowrap;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);box-shadow:inset 0 0 0 1px rgba(79,163,255,.25)}
.btn{appearance:none;cursor:pointer;border:0;position:relative;overflow:hidden;background:linear-gradient(180deg,#1C3452,#0B1626);color:var(--ink);font-family:var(--f-hud);font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase;padding:0 18px;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:inset 0 0 0 1px rgba(79,163,255,.3)}
.btn:active:not(:disabled){transform:scale(.985);filter:brightness(1.2)}
.btn.primary{background:linear-gradient(180deg,#5BE6FF 0%,#2E86F0 55%,#1E5FD0 100%);color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.25)}
.btn.primary:not(:disabled)::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%) -120% 0/250% 100% no-repeat;animation:sheen 2.6s ease-in-out infinite}
.btn.danger{background:linear-gradient(180deg,#4A1518,#22090B);color:#FF8A8A;box-shadow:inset 0 0 0 1px rgba(239,68,68,.45)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;background:rgba(12,25,41,.9);box-shadow:inset 0 0 0 1px var(--edge);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.stepper button{appearance:none;min-height:42px;background:transparent;border:0;color:var(--vesper-2);font-size:22px;cursor:pointer}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--f-hud);font-weight:700;font-size:19px;color:var(--ink);min-width:0;width:100%;-moz-appearance:textfield;appearance:textfield}
.stepper.sm{grid-template-columns:34px 40px 34px}
.stepper.sm button{min-height:38px;font-size:19px}
.stepper.sm input{font-size:17px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field{display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.field input{background:rgba(12,25,41,.9);border:1px solid var(--edge);color:var(--ink);font-family:var(--f-hud);font-size:18px;font-weight:700;padding:10px 12px;min-height:48px;width:100%}
.field input:focus{border-color:var(--vesper-2);outline:none;box-shadow:0 0 0 1px var(--vesper-2)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--vesper-2)}

/* ---------- fiches : décompte, comparaison, coûts ---------- */
.busybox{display:flex;gap:14px;align-items:center;padding:12px;border-color:rgba(0,229,255,.55)}
.tring.big{position:relative;inset:auto;width:74px;height:74px;flex:none;background:none}
.tring.big b{font-size:17px}
.tring.big svg{inset:0;width:100%;height:100%}
.busy-eta{font-family:var(--f-hud);font-size:28px;font-weight:700;line-height:1.05;color:var(--vesper-2);text-shadow:0 0 14px rgba(0,229,255,.5)}
.cbars{display:grid;gap:8px;padding:10px 12px;--cut:8px}
.cb{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:3px 8px;align-items:center;--c:var(--ink-2)}
.cb .ri{width:15px;height:15px}
.cb-n{font-size:12.5px;color:var(--ink-2);text-transform:capitalize}
.cb-t{font-family:var(--f-hud);font-size:15px;font-weight:600;color:var(--ink-3)}
.cb-t b{color:var(--ink);font-weight:700}
.cb.short .cb-t b{color:#FF7A7A}
.cb-bar{grid-column:1 / -1;height:4px;background:rgba(255,255,255,.07);overflow:hidden}
.cb-bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 6px var(--c);transition:width .6s ease}
.cb.short .cb-bar i{background:#EF4444;box-shadow:none}
.dur-line{display:flex;align-items:center;gap:6px;font-family:var(--f-hud);font-size:15px;font-weight:600;color:var(--ink-2);--c:var(--ink-3)}

/* ---------- carte ---------- */
.map-wrap{overflow:hidden;border:1px solid var(--edge);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);background:linear-gradient(rgba(4,7,13,.55),rgba(4,7,13,.75)),var(--img-carina,none) center/cover,var(--void)}
.map{width:100%;height:auto;display:block;touch-action:manipulation}
.bg-star{fill:var(--star)}
.orbit{fill:none;stroke:rgba(0,229,255,.12);stroke-width:1}
.range{fill:rgba(59,130,246,.07);stroke:rgba(0,229,255,.55);stroke-width:1.3;stroke-dasharray:4 6}
.body{cursor:pointer;outline:none}
.body .hit{fill:transparent}
.body:focus-visible .hit{stroke:var(--vesper-2);stroke-width:2}
.f-ore{fill:var(--ore)}.f-ice{fill:var(--ice)}.f-data{fill:var(--data)}.f-danger{fill:var(--danger)}.f-vesper{fill:var(--vesper)}.f-pop{fill:var(--pop)}
.dim{opacity:.72}
.hl{fill:var(--hl)}
.b-sel{fill:rgba(245,158,11,.14);stroke:var(--energy);stroke-width:2}
.b-tgt{fill:none;stroke:var(--energy);stroke-width:1.5;stroke-dasharray:3 4}
.b-q{fill:var(--ink-2);font-size:11px;font-weight:800;text-anchor:middle;font-family:var(--f-hud)}
.b-dust{fill:rgba(228,237,248,.3)}
.b-lvl{fill:#fff;font-size:10px;font-weight:800;text-anchor:middle;font-family:var(--f-hud)}
.b-out{stroke:var(--void);stroke-width:1.5}
.b-dome{fill:var(--void)}
.trail{stroke:var(--energy);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round;opacity:.75;fill:none}
.fdot{fill:var(--energy);transition:transform 1s linear}
.planet{background:radial-gradient(circle,rgba(228,237,248,.07),transparent 70%)}
.facts{display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.facts b{color:var(--ink)}
.missions{display:grid;gap:8px}
.mission .hint{font-size:12.5px;color:var(--ink-3);margin-top:4px;text-align:center}

/* ---------- journal ---------- */
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.qlist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid rgba(79,163,255,.14)}
.qlist li:last-child{border-bottom:0}
.qcheck{width:20px;height:20px;transform:rotate(45deg);display:grid;place-items:center;border:2px solid var(--card-3);font-size:11px;font-weight:800;color:var(--on-accent)}
.qcheck > *{transform:rotate(-45deg)}
.qlist li.done .qcheck{background:var(--ok);border-color:var(--ok)}
.qlist li.cur .qcheck{border-color:var(--vesper-2);box-shadow:0 0 10px var(--vesper-2)}
.qlist h4{font-size:16px;font-weight:700}
.qlist li.done h4{color:var(--ink-3);font-weight:500}
.qlist p{font-size:12.5px;color:var(--ink-2)}
.qlist .rw{font-family:var(--f-hud);font-size:13px;font-weight:600;color:var(--pop)}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--vesper-2),rgba(0,229,255,.1))}
.timeline li{position:relative;padding:0 0 12px 20px;font-size:13.5px;--c:var(--ink-3)}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:0;top:5px;width:10px;height:10px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 8px var(--c)}
.timeline li.new{animation:rowIn .4s ease both}
.timeline .when{display:block;font-family:var(--f-hud);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.timeline .when b{color:var(--c);font-weight:700;text-transform:uppercase}
.k-build{--c:var(--ore)}.k-research{--c:var(--data)}.k-yard{--c:var(--ice)}.k-fleet{--c:var(--energy)}.k-raid{--c:var(--danger)}.k-quest{--c:var(--pop)}.k-info{--c:var(--ink-2)}
.colophon{margin-top:22px;font-size:11.5px;color:var(--ink-3);text-align:center}

/* ---------- barre d’onglets ---------- */
.nav{position:fixed;z-index:25;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(10,22,38,.97),rgba(4,9,16,.99));border-top:1px solid var(--edge);box-shadow:0 -1px 0 rgba(0,229,255,.12),0 -10px 30px rgba(0,0,0,.5);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:640px;margin:0 auto}
.dk{appearance:none;background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-family:var(--f-hud);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;position:relative;cursor:pointer;min-width:0;padding:0}
.dk::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:transparent}
.dki{width:40px;height:26px;display:grid;place-items:center}
.dk svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.dk[aria-current="page"]{color:var(--ink);text-shadow:0 0 10px rgba(0,229,255,.5)}
.dk[aria-current="page"]::before{background:var(--vesper-2);box-shadow:0 0 12px var(--vesper-2)}
.dk[aria-current="page"] svg{stroke:var(--vesper-2);filter:drop-shadow(0 0 5px rgba(0,229,255,.6))}
.dk .bd{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;background:var(--vesper);color:#fff;font-size:11px;font-weight:700;letter-spacing:0;display:grid;place-items:center;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.dk .bd.red{background:var(--danger);animation:blink 1.1s ease-in-out infinite}
.dk .bd.new{background:var(--energy);color:#1A0F00}

/* ---------- fiches ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:640px;max-height:88vh;max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;background:var(--noise),linear-gradient(180deg,rgba(18,40,66,.98),rgba(6,13,22,.99) 40%);background-size:160px 160px,auto;border-top:1px solid var(--edge-hi);box-shadow:0 -1px 0 rgba(0,229,255,.25),0 -16px 40px var(--shadow);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%,0 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:11px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";position:absolute;top:7px;left:50%;width:44px;height:3px;margin-left:-22px;background:var(--vesper-2);box-shadow:0 0 10px var(--vesper-2);opacity:.7}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-x{appearance:none;position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:34px;height:34px;border:0;background:rgba(12,25,41,.9);box-shadow:inset 0 0 0 1px var(--edge);color:var(--ink-2);font-size:19px;line-height:1;display:grid;place-items:center;cursor:pointer;z-index:3;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.sh-head{display:flex;gap:12px;align-items:center;padding-right:40px}
.sh-head > div{min-width:0}
.sh-thumb{position:relative;width:84px;height:84px;overflow:hidden;flex:none;background:var(--card-2);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:inset 0 0 0 1px var(--edge-hi)}
.sh-thumb img,.sh-thumb svg{width:100%;height:100%;display:block;object-fit:cover}
.sh-thumb img:not([src]){visibility:hidden}
.sh-head h2,.sh-title h2{font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere;line-height:1.05}
.sh-title{padding-right:40px}
.eyebrow{font-family:var(--f-hud);font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--vesper-2)}
.sheet h2{font-size:24px;font-weight:700}
.sheet-h{display:grid;gap:3px}
.sheet-art{height:120px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);background:linear-gradient(180deg,rgba(4,7,13,0),rgba(4,7,13,.5)),var(--img-carina,none) center 35%/cover,var(--card)}
.sheet-art.bright{background:radial-gradient(circle at 50% 120%,var(--ink) 0,var(--vesper-2) 20%,var(--vesper) 38%,color-mix(in oklab,var(--vesper) 30%,var(--sky)) 58%,transparent 78%),var(--img-carina,none) center/cover}
.sheet-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.sheet-actions.one{grid-template-columns:1fr}
.lede{color:var(--ink-2);font-size:14px}
.rs{display:grid;gap:2px}
.rs-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(79,163,255,.14);--c:var(--ink-2)}
.rs-row:last-child{border-bottom:0}
.rs-row .ri{width:16px;height:16px;grid-row:span 2}
.rs-n{font-family:var(--f-hud);font-size:16px;font-weight:700}
.rs-v{font-family:var(--f-hud);font-size:16px;font-weight:700;text-align:right}
.rs-s{grid-column:2 / -1;font-size:12px;color:var(--ink-3)}
.rs-s.warn{color:#FF7A7A;font-weight:700}
.fc-rows{display:grid;gap:6px}
.fc-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:rgba(12,25,41,.85);box-shadow:inset 0 0 0 1px var(--edge);padding:6px 8px;--c:var(--ink-2);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.fc-th{width:44px;height:44px}
.fc-n{min-width:0;display:grid;font-size:13.5px;line-height:1.2}
.fc-n b{font-family:var(--f-hud);font-size:15.5px;font-weight:700}
.fc-n .muted{font-size:12px}
.fc-row .chipbtn{flex:none;min-height:38px;padding:0 10px}
.fc-sum{display:grid;gap:5px;font-size:13px;color:var(--ink-2);background:rgba(12,25,41,.85);box-shadow:inset 2px 0 0 var(--vesper-2);padding:10px 12px}
.fc-sum b{color:var(--ink);font-family:var(--f-hud);font-size:15px}
.fc-sum .bad{color:#FF8A8A;font-weight:700}
.cell-top{display:flex;gap:12px;align-items:center;padding-right:40px}
.cell-top > div{min-width:0}
.cell-art{width:66px;height:66px;flex:none;border-radius:50%;background:radial-gradient(circle,rgba(228,237,248,.07),transparent 70%)}
.speeds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border:0;padding:0;margin:0;min-width:0}
.speeds legend{font-family:var(--f-hud);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px;padding:0}
.speed{position:relative;display:grid;gap:1px;padding:9px 10px;background:rgba(12,25,41,.85);box-shadow:inset 0 0 0 1px var(--edge);cursor:pointer;min-width:0;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.speed input{position:absolute;opacity:0;pointer-events:none}
.speed:has(input:checked){box-shadow:inset 0 0 0 2px var(--vesper-2);background:linear-gradient(180deg,rgba(59,130,246,.35),rgba(12,25,41,.9))}
.speed:has(input:focus-visible){outline:2px solid var(--vesper-2);outline-offset:2px}
.speed .mul{font-family:var(--f-hud);font-weight:700;font-size:22px;color:var(--vesper-2)}
.speed b{font-family:var(--f-hud);font-size:15px}
.speed span:last-child{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.danger-zone{border-top:1px solid var(--edge);padding-top:12px;display:grid;gap:8px}
.credits{font-size:12.5px;color:var(--ink-2)}
.credits summary{cursor:pointer;font-family:var(--f-hud);font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);padding:6px 0}
.credits ul{margin:6px 0 8px;padding-left:18px;display:grid;gap:3px}
.credits p{color:var(--ink-3)}

/* ---------- bandeau de lancement ---------- */
.launch{appearance:none;position:fixed;z-index:45;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 96px);max-width:616px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border:0;color:var(--ink);text-align:left;cursor:pointer;border-color:rgba(0,229,255,.6);box-shadow:inset 0 0 0 1px rgba(0,229,255,.5),inset 0 0 30px rgba(0,229,255,.12);transform:translateY(-140%);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.25,1.2),opacity .25s;pointer-events:none}
.launch.show{transform:none;opacity:1;pointer-events:auto}
.l-thumb{width:52px;height:52px;flex:none;overflow:hidden;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.l-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.l-main{flex:1;min-width:0;display:grid;gap:3px}
.l-t{font-family:var(--f-hud);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-eta{font-family:var(--f-hud);font-size:22px;font-weight:700;color:var(--vesper-2);text-shadow:0 0 12px rgba(0,229,255,.6)}

/* ---------- célébration de fin ---------- */
.celebrate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(0,40,70,.55),rgba(2,5,10,.82));padding:24px;cursor:pointer}
.celebrate[hidden]{display:none}
.cel-card{width:min(320px,100%);display:grid;justify-items:center;gap:6px;padding:26px 18px 20px;text-align:center;--cut:16px;border-color:color-mix(in oklab,var(--c) 70%,transparent);overflow:hidden}
.celebrate.show .cel-card{animation:celIn .5s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes celIn{from{transform:scale(.6);opacity:0}}
.cel-burst{position:absolute;left:50%;top:84px;width:420px;height:420px;margin:-210px 0 0 -210px;background:repeating-conic-gradient(from 0deg,color-mix(in oklab,var(--c) 30%,transparent) 0 8deg,transparent 8deg 22deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 62%);mask:radial-gradient(circle,#000 20%,transparent 62%);animation:spin 9s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cel-thumb{position:relative;width:132px;height:132px;overflow:hidden;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:inset 0 0 0 2px var(--c);margin-bottom:6px}
.cel-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.cel-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.6) 45%,transparent 60%) -120% 0/250% 100% no-repeat;animation:sheen 1.6s ease-out .3s 1 both}
.cel-card .hud-k{position:relative;color:var(--c);font-size:13px}
.cel-t{position:relative;font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cel-g{position:relative;font-family:var(--f-hud);font-size:20px;font-weight:700;color:var(--vesper-2);text-shadow:0 0 14px rgba(0,229,255,.55)}
.cel-tap{position:relative;font-size:11.5px;color:var(--ink-3);margin-top:6px}

/* ---------- notifications ---------- */
.toasts{position:fixed;z-index:60;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;pointer-events:none;max-width:616px;margin:0 auto}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--noise),linear-gradient(90deg,color-mix(in oklab,var(--c) 22%,rgba(12,25,41,.97)),rgba(8,16,28,.97) 55%);background-size:160px 160px,auto;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 45%,transparent),0 12px 28px var(--shadow);padding:9px 12px;font-size:13px;animation:toastIn .3s cubic-bezier(.2,.9,.25,1.2);pointer-events:auto;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);--c:var(--ink-3)}
@keyframes toastIn{from{transform:translateX(-30px);opacity:0}}
.toast .tdot{width:9px;height:9px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 8px var(--c);flex:none;margin-top:5px}
.toast b{display:block;font-family:var(--f-hud);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700}

@media (min-width:700px){
  .modal{align-items:center;padding:24px}
  .sheet{max-width:520px;max-height:calc(100dvh - 48px);clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
  .sheet::before{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function rates() {

  const need = (MOD.drill.staff(b.drill) + MOD.ice.staff(b.ice) + MOD.sail.staff(b.sail) + MOD.lab.staff(b.lab)) * sm;
  const staff = need > 0 ? Math.min(1, st.pop / need) : 1;

function sumCost(c) { return (c.ore || 0) + (c.ice || 0) + (c.data || 0) * 3; }

const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
function hexDist(q, r) { return (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2; }
const NAMES = {
  wreck: ['Tarsis', 'Mélusine', 'Anse-Bleue', 'Corvidé', 'Pénitence', 'Saint-Elme', 'Lumen', 'Ondine', 'Héron', 'Calliope'],
  nest: ['Nid de la Faille', 'Repaire Mâchefer', 'Nid Écarlate', 'Antre Sans-Lune', 'Nid des Cendres', 'Repaire Rouille', 'Nid Vipère', 'Antre du Croc'],
  anomaly: ['Signal fantôme', 'Écho de Vesper', 'Balise muette', 'Sphère froide', 'Distorsion Hélix', 'Murmure gravitationnel'],

function corsairComp(P, R) {
  const pw = k => PIRATE[k].atk + PIRATE[k].hull / 4;
  const c = { skiff: 0, breaker: 0, maw: 0 }; let rem = P;
  if (P > 5000) { c.maw = Math.floor(rem * (0.3 + 0.2 * R()) / pw('maw')); rem -= c.maw * pw('maw'); }
  if (P > 800) { c.breaker = Math.floor(rem * (0.4 + 0.2 * R()) / pw('breaker')); rem -= c.breaker * pw('breaker'); }
  c.skiff = Math.max(1, Math.round(rem / pw('skiff')));

}
function genMap(seed) {
  const R = makeRng(seed); const cells = {};
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  for (let q = -RADIUS; q <= RADIUS; q++) {
    for (let r = Math.max(-RADIUS, -q - RADIUS); r <= Math.min(RADIUS, -q + RADIUS); r++) {
      const d = hexDist(q, r); const c = { q, r, d, type: 'empty' };
      if (d === 0) { c.type = 'home'; c.known = true; }
      else {
        const x = R(); const pn = d >= 2 ? 0.06 + 0.04 * d : 0;
        if (x < pn) c.type = 'nest';
        else if (x < pn + 0.23) c.type = 'asteroid';
        else if (x < pn + 0.40) c.type = 'comet';
        else if (x < pn + 0.50) c.type = 'wreck';
        else if (x < pn + 0.58) c.type = 'anomaly';

  if (!ring1.some(c => c.type === 'comet')) ring1.find(c => c.type !== 'asteroid').type = 'comet';
  const ring2 = Object.values(cells).filter(c => c.d === 2);
  if (!ring2.some(c => c.type === 'nest')) shuffle(ring2)[0].type = 'nest';
  let nests = Object.values(cells).filter(c => c.type === 'nest').length;
  for (const c of shuffle(Object.values(cells).filter(c => c.d >= 3 && c.type === 'empty'))) { if (nests >= 4) break; c.type = 'nest'; nests++; }

    else if (c.type === 'comet') { c.ice = Math.round(2000 * (1 + 0.8 * d) * f()); c.name = `Comète C/${10 + Math.floor(R() * 89)}`; }
    else if (c.type === 'wreck') { c.ore = Math.round(600 * (1 + d) * f()); c.ice = Math.round(400 * (1 + d) * f()); c.data = Math.round(60 * (1 + d) * f()); c.name = `Épave « ${pick(NAMES.wreck)} »`; }
    else if (c.type === 'anomaly') { c.data = Math.round(180 * d * (0.8 + 0.4 * R())); c.name = pick(NAMES.anomaly); }
    else if (c.type === 'nest') {

      c.garrison = corsairComp(110 * 2.1 ** (c.lvl - 1), R);

      c.name = nestNames.pop() || 'Nid corsaire';
    }
  }

}

function produce(dt) {
  const r = rates(), h = dt / HOUR;
  for (const k of ['ore', 'ice']) if (st.res[k] < r.store) st.res[k] = Math.min(r.store, st.res[k] + r[k] * h);
  st.res.data += r.data * h;
  if (st.pop < r.cap) st.pop = Math.min(r.cap, st.pop + (0.9 * st.pop * (1 - st.pop / r.cap) + 2.5) * h * st.speed);
}
function nextEvent() {
  let t = Infinity, kind = null, ref = null;
  const b = st.q.build[0]; if (b && b.end < t) { t = b.end; kind = 'build'; }
  const r = st.q.research[0]; if (r && r.end < t) { t = r.end; kind = 'research'; }
  const y = st.q.yard[0]; if (y) { const tt = y.start + (y.done + 1) * y.each; if (tt < t) { t = tt; kind = 'yard'; } }
  for (const f of st.fleets) { const tt = f.phase === 'out' ? f.arrive : f.back; if (tt < t) { t = tt; kind = 'fleet'; ref = f; } }
  if (st.raid && st.raid.at < t) { t = st.raid.at; kind = 'raid'; }

}
function advanceTo(T) {

    const target = Math.min(T, ev.t);
    while (st.t < target) { const step = Math.min(MIN, target - st.t); produce(step); st.t += step; }
    if (ev.kind && ev.t <= T) { handle(ev); bump(); } else break;
  }

function startJob(j, t, kind) { j.start = t; j.end = t + (kind === 'build' ? bTime(j.cost) : rTime(j.cost)); }
function handle(ev) {

    const j = st.q.research.shift(); st.tech[j.id] = j.lvl;
    log('research', `${TECH[j.id].name} : niveau ${j.lvl} maîtrisé.`); fxDone('tech', j.id, j.lvl);

    if (y.done >= y.n) { st.q.yard.shift(); log('yard', `Livraison du chantier : ${fmt(y.n)} ${shipName(y.id, y.n)}.`); fxDone('ship', y.id, y.n); if (st.q.yard[0]) st.q.yard[0].start = t; }

}

/* ================= combat ================= */
function playerGroups(ships, withBastion) {
  const g = [];
  for (const id of SHIP_ORDER) { const n = ships[id] || 0; if (n > 0) g.push({ key: id, n, atk: shipAtk(id), hull: shipHull(id), w: 1, wound: 0 }); }
  if (withBastion && lvl('bastion') > 0) g.push({ key: 'bastion', n: 1, atk: bastionAtk(), hull: bastionHull(), w: 8, wound: 0, fixed: true });
  return g;
}
function pirateGroups(comp) { return Object.keys(PIRATE).filter(k => comp[k] > 0).map(k => ({ key: k, n: comp[k], atk: PIRATE[k].atk, hull: PIRATE[k].hull, w: 1, wound: 0 })); }
function hit(groups, dmg) {
  const W = groups.reduce((s, g) => s + g.n * g.w, 0); if (W <= 0) return;
  for (const g of groups) {
    const share = dmg * g.n * g.w / W;
    g.wound += share;
    const k = Math.min(g.n, Math.floor(g.wound / g.hull));
    g.n -= k; g.wound -= k * g.hull; if (g.n === 0) g.wound = 0;

}
function battle(A, D) {
  const a0 = A.map(g => g.n), d0 = D.map(g => g.n); let rounds = 0;
  while (rounds < 6) {
    const aA = A.filter(g => g.n > 0), aD = D.filter(g => g.n > 0);
    if (!aA.length || !aD.length) break;
    rounds++;
    const dA = aA.reduce((s, g) => s + g.n * g.atk, 0) * (0.85 + 0.3 * rnd());
    const dD = aD.reduce((s, g) => s + g.n * g.atk, 0) * (0.85 + 0.3 * rnd());
    hit(aD, dA); hit(aA, dD);
  }
  const lossA = {}, lossD = {};
  A.forEach((g, i) => { if (!g.fixed && a0[i] - g.n > 0) lossA[g.key] = a0[i] - g.n; });
  D.forEach((g, i) => { if (!g.fixed && d0[i] - g.n > 0) lossD[g.key] = d0[i] - g.n; });
  return { rounds, attDead: !A.some(g => g.n > 0), defDead: !D.some(g => g.n > 0), lossA, lossD, D };
}
function scheduleRaid(from) {
  const gap = (35 + 40 * rnd()) * MIN / st.speed;
  const P = (60 + 7 * Math.pow(score(), 0.9)) * (1 + 0.08 * aliveNests()) * (0.8 + 0.4 * rnd());
  st.raid = { at: from + gap, comp: corsairComp(P, rnd) };
}
function resolveRaid() {
  const raid = st.raid; st.raid = null;
  const rep = battle(pirateGroups(raid.comp), playerGroups(st.ships, true));
  for (const k in rep.lossD) st.ships[k] -= rep.lossD[k];
  const killed = listText(rep.lossA, PIRATE), lost = listText(rep.lossD, SHIP);
  if (rep.attDead) {
    let ore = 0, ice = 0;
    for (const k in rep.lossA) { ore += PIRATE[k].salvage[0] * rep.lossA[k]; ice += PIRATE[k].salvage[1] * rep.lossA[k]; }
    ore = Math.round(ore * 0.4); ice = Math.round(ice * 0.4); gain({ ore, ice });
    st.stats.raidsWon++;
    log('raid', `Raid repoussé. Abattus : ${killed || 'aucun'}. Pertes : ${lost || 'aucune'}. Débris récupérés : ${fmt(ore)} minerai, ${fmt(ice)} glace.`);
  } else if (rep.defDead) {
    const prot = protectedAmt(), stolen = {};
    for (const k of ['ore', 'ice']) { stolen[k] = Math.floor(Math.max(0, st.res[k] - prot) * 0.3); st.res[k] -= stolen[k]; }
    st.stats.raidsLost++;
    log('raid', `Les corsaires ont percé les défenses${lost ? ' (pertes : ' + lost + ')' : ''} et emporté ${fmt(stolen.ore)} minerai et ${fmt(stolen.ice)} glace.`);
  } else {
    log('raid', `Les corsaires battent en retraite après ${rep.rounds} salve${rep.rounds > 1 ? 's' : ''}. Abattus : ${killed || 'aucun'}. Pertes : ${lost || 'aucune'}.`);
  }
}

/* ================= flottes ================= */
function turnBack(f, t, p0) { f.phase = 'back'; f.bs = t; f.p0 = p0; f.back = t + f.dur * p0; }
function removeFleet(f) { st.fleets = st.fleets.filter(x => x !== f); }
function fleetEmpty(f) { return !Object.values(f.ships).some(n => n > 0); }
function fleetArrive(f, t) {
  const c = st.map[f.k]; const cap = fleetCargo(f.ships); let note = '';
  const title = c.name || TYPE_NAME[c.type];
  if (f.m === 'explore') {
    c.known = true; neighbors(c).forEach(n => { n.known = true; });
    st.stats.explored++;
    if (c.type === 'anomaly' && !c.studied) { c.studied = true; f.cargo.data = (f.cargo.data || 0) + c.data; note = `${title} étudiée : ${fmt(c.data)} données à rapporter.`; }
    else note = `Case ${c.q}:${c.r} cartographiée : ${(c.name || TYPE_NAME[c.type]).toLowerCase() === 'vide spatial' ? 'rien que du vide' : (c.name || TYPE_NAME[c.type])}.`;
  } else if (f.m === 'extract') {
    const kind = c.type === 'asteroid' ? 'ore' : c.type === 'comet' ? 'ice' : null;
    if (!(f.ships.drone > 0)) note = 'Aucun Drone foreur dans la flotte : extraction impossible.';
    else if (!kind || !(c[kind] > 0)) note = `${title} : gisement introuvable ou épuisé.`;
    else {
      const take = Math.floor(Math.min(cap, c[kind])); c[kind] -= take; f.cargo[kind] = (f.cargo[kind] || 0) + take; f.got = true;
      note = `${fmt(take)} ${RES_NAME[kind]} chargés sur ${title}.`;
      if (c[kind] <= 0 && !c.outpost) { c.was = c.type; c.type = 'depleted'; c.name = (c.was === 'comet' ? 'Comète dissipée' : 'Astéroïde épuisé'); note += ' Le gisement est épuisé.'; }
    }
  } else if (f.m === 'salvage') {
    if (!(f.ships.drone > 0)) note = 'Aucun Drone foreur dans la flotte : récupération impossible.';
    else if (c.type !== 'wreck' && c.type !== 'debris') note = 'Il n’y a plus rien à récupérer ici.';
    else {
      const tot = (c.ore || 0) + (c.ice || 0) + (c.data || 0); const k = tot > 0 ? Math.min(1, cap / tot) : 0; const got = {};
      for (const r of ['ore', 'ice', 'data']) { got[r] = Math.floor((c[r] || 0) * k); c[r] = (c[r] || 0) - got[r]; f.cargo[r] = (f.cargo[r] || 0) + got[r]; }
      f.got = true;
      note = `Récupéré sur ${title} : ${fmt(got.ore)} minerai, ${fmt(got.ice)} glace, ${fmt(got.data)} données.`;
      if ((c.ore || 0) + (c.ice || 0) + (c.data || 0) < 1) { c.type = 'empty'; c.name = null; note += ' Le site est vidé.'; }
    }
  } else if (f.m === 'attack') {
    if (c.type !== 'nest') note = 'Le nid a disparu avant votre arrivée.';
    else {
      const rep = battle(playerGroups(f.ships, false), pirateGroups(c.garrison));
      for (const k in rep.lossA) f.ships[k] -= rep.lossA[k];
      rep.D.forEach(g => { c.garrison[g.key] = g.n; });
      const killed = listText(rep.lossD, PIRATE), lost = listText(rep.lossA, SHIP);
      if (rep.defDead) {
        st.stats.nests++;
        const room = fleetCargo(f.ships); const tot = c.loot.ore + c.loot.ice + c.loot.data; const k = tot > 0 ? Math.min(1, room / tot) : 0;
        const take = {}; for (const r of ['ore', 'ice', 'data']) { take[r] = Math.floor(c.loot[r] * k); f.cargo[r] = (f.cargo[r] || 0) + take[r]; }
        const old = c.name;
        c.type = 'debris'; c.name = ruinName(old);
        c.ore = c.loot.ore - take.ore + 300 * c.lvl; c.ice = c.loot.ice - take.ice + 200 * c.lvl; c.data = c.loot.data - take.data;
        delete c.garrison; delete c.loot;
        note = `${old} détruit après ${rep.rounds} salve${rep.rounds > 1 ? 's' : ''}. Abattus : ${killed || 'aucun'}. Pertes : ${lost || 'aucune'}. Butin chargé : ${fmt(take.ore)} minerai, ${fmt(take.ice)} glace, ${fmt(take.data)} données.`;
      } else if (rep.attDead) note = `Flotte anéantie devant ${title}. Abattus : ${killed || 'aucun'}.`;
      else note = `Assaut repoussé par ${title} après ${rep.rounds} salve${rep.rounds > 1 ? 's' : ''}. Abattus : ${killed || 'aucun'}. Pertes : ${lost || 'aucune'}.`;
    }
  } else if (f.m === 'outpost') {
    if (!(f.ships.seed > 0)) note = 'Aucun Semeur dans la flotte.';
    else if (!(c.type === 'asteroid' || c.type === 'comet') || c.outpost) note = `${title} ne peut plus accueillir d’avant-poste.`;
    else if (st.outk.length >= maxOutposts()) note = 'Plafond d’avant-postes atteint : améliorez l’Antenne profonde.';
    else {
      c.outpost = c.type === 'asteroid' ? 'ore' : 'ice'; st.outk.push(f.k); f.ships.seed--; st.stats.outposts++;
      note = `Avant-poste fondé sur ${title} : +${fmt(outpostYield(c) * st.speed)} ${RES_NAME[c.outpost]}/h.`;
    }
  }
  log(fleetEmpty(f) && f.m === 'attack' ? 'raid' : 'fleet', note);
  if (fleetEmpty(f)) { removeFleet(f); return; }
  turnBack(f, t, 1);
}
function fleetHome(f) {
  for (const k in f.ships) if (f.ships[k] > 0) st.ships[k] = (st.ships[k] || 0) + f.ships[k];
  const got = Object.keys(f.cargo).filter(k => f.cargo[k] > 0);
  const lost = gain(f.cargo);
  if (f.got && got.length) st.stats.extracted++;
  const txt = got.length ? ` avec ${got.map(k => fmt(f.cargo[k]) + ' ' + RES_NAME[k]).join(', ')}` : '';
  log('fleet', `Flotte ${f.id} rentrée à quai${txt}.${lost > 0 ? ' Entrepôt plein : ' + fmt(lost) + ' unités perdues.' : ''}`);
  removeFleet(f);

/* ================= actions du joueur ================= */
function doBuild(id) {
  const m = MOD[id]; if (!reqOk(m.req)) return;
  const P = pendingB(id); if (m.max && P >= m.max) return;
  if (st.q.build.length >= 3) return toast('La file de construction est pleine (3 chantiers).', 'info');
  const c = cost(m.cost(P + 1)); if (!afford(c)) return toast('Ressources insuffisantes.', 'info');
  pay(c); const j = { id, lvl: P + 1, cost: c }; st.q.build.push(j);
  if (st.q.build.length === 1) startJob(j, st.t, 'build');
}
function cancelQueue(list, i, kind) {
  const j = list[i]; if (!j) return list;
  const removed = list.filter((x, k) => k >= i && x.id === j.id);
  removed.forEach(x => refund(x.cost));
  const out = list.filter(x => !removed.includes(x));
  if (i === 0 && out[0]) startJob(out[0], st.t, kind);
  const name = kind === 'build' ? MOD[j.id].name : TECH[j.id].name;
  log('info', `${kind === 'build' ? 'Chantier' : 'Recherche'} annulé${kind === 'build' ? '' : 'e'} : ${name} niveau ${j.lvl}${removed.length > 1 ? ' et suivants' : ''}. Ressources restituées.`);
  return out;
}
function doResearch(id) {
  const t = TECH[id]; if (!reqOk(t.req)) return;
  if (st.q.research.length >= 2) return toast('Deux recherches sont déjà programmées.', 'info');
  const P = pendingT(id); const c = cost(t.cost(P + 1)); if (!afford(c)) return toast('Ressources insuffisantes.', 'info');
  pay(c); const j = { id, lvl: P + 1, cost: c }; st.q.research.push(j);
  if (st.q.research.length === 1) startJob(j, st.t, 'research');
}
function doShips(id, n) {
  const s = SHIP[id]; if (!reqOk(s.req)) return; n = Math.floor(n); if (!(n >= 1)) return;
  if (st.q.yard.length >= 5) return toast('Le chantier accepte cinq commandes à la fois.', 'info');
  const c = shipCost(id, n); if (!afford(c)) return toast(c.pop && st.pop < c.pop ? 'Pas assez de colons pour armer ces Semeurs.' : 'Ressources insuffisantes.', 'info');
  pay(c); const y = { id, n, done: 0, each: sTime(id), unit: shipCost(id, 1) }; st.q.yard.push(y);
  if (st.q.yard.length === 1) y.start = st.t;
}
function cancelYard(i) {
  const y = st.q.yard[i]; if (!y) return;
  refund(mulCost(y.unit, y.n - y.done)); st.q.yard.splice(i, 1);
  if (i === 0 && st.q.yard[0]) st.q.yard[0].start = st.t;
  log('info', `Commande annulée : ${fmt(y.n - y.done)} ${shipName(y.id, y.n - y.done)}. Ressources restituées.`);
}
function fcCheck() {
  if (!fc) return { ok: false, msg: '' };
  const c = st.map[fc.k], s = fc.sel; const n = k => s[k] || 0;
  const total = Object.values(s).reduce((a, b) => a + (b || 0), 0);
  for (const k in s) if (n(k) > (st.ships[k] || 0)) return { ok: false, msg: 'Vous n’avez pas autant de vaisseaux à quai.' };
  if (!total) return { ok: false, msg: 'Choisissez au moins un vaisseau.' };
  if (fc.m === 'explore' && !n('scout')) return { ok: false, msg: 'Il faut au moins un Éclaireur.' };
  if ((fc.m === 'extract' || fc.m === 'salvage') && !n('drone')) return { ok: false, msg: 'Il faut au moins un Drone foreur.' };
  if (fc.m === 'attack' && !ARMED.some(k => n(k))) return { ok: false, msg: 'Il faut au moins un vaisseau armé.' };
  if (fc.m === 'outpost') {
    if (!n('seed')) return { ok: false, msg: 'Il faut un Semeur.' };
    const going = st.fleets.filter(f => f.m === 'outpost' && f.phase === 'out').length;
    if (st.outk.length + going >= maxOutposts()) return { ok: false, msg: `Plafond de ${maxOutposts()} avant-poste${maxOutposts() > 1 ? 's' : ''} atteint. Améliorez l’Antenne profonde.` };
    if (c.outpost) return { ok: false, msg: 'Cette case a déjà un avant-poste.' };
  }

}
function launch() {
  const chk = fcCheck(); if (!chk.ok) { toast(chk.msg, 'info'); return false; }
  const c = st.map[fc.k]; const ships = {};
  for (const k in fc.sel) if (fc.sel[k] > 0) { ships[k] = fc.sel[k]; st.ships[k] -= fc.sel[k]; }
  const dur = travelMs(c.d, ships);
  const f = { id: st.fid++, ships, m: fc.m, k: fc.k, depart: st.t, arrive: st.t + dur, dur, phase: 'out', cargo: {} };
  st.fleets.push(f);
  const where = visible(c) && c.name ? c.name : 'la case ' + c.q + ':' + c.r;
  log('fleet', `Flotte ${f.id} en route : ${MISSION[f.m].name.toLowerCase()} ${where}. Arrivée dans ${fmtDur(dur)}.`);
  return true;
}
function recall(id) {
  const f = st.fleets.find(x => x.id === id); if (!f || f.phase !== 'out') return;
  const p = clamp01((st.t - f.depart) / (f.arrive - f.depart));
  turnBack(f, st.t, p); f.recalled = true;
  log('fleet', `Flotte ${f.id} rappelée. Retour dans ${fmtDur(f.back - st.t)}.`);
}
function found(name, speed) {
  const now = Date.now();
  st.name = (name || '').trim().slice(0, 24) || 'Kestrel-7';
  st.speed = speed; st.created = now; st.t = now; st.founded = true;
  st.raid = { at: now + 40 * MIN / speed, comp: corsairComp(70, rnd) };
  log('info', `La station ${st.name} est fondée en orbite de Vesper. Les corsaires de la Faille rôdent : préparez vos défenses.`);
}

/* ================= objectifs ================= */
function checkQuests() {
  if (!st.founded) return;
  for (const q of QUESTS) {
    if (st.quests[q.id] || !q.ok()) continue;
    st.quests[q.id] = st.t;
    const rw = q.reward || {};
    for (const k of ['ore', 'ice', 'data']) if (rw[k]) st.res[k] += rw[k];
    if (rw.ships) for (const k in rw.ships) st.ships[k] = (st.ships[k] || 0) + rw.ships[k];
    log('quest', `Objectif accompli : ${q.title}.${rewardText(rw) ? ' Récompense : ' + rewardText(rw) + '.' : ''}`);
    bump();
  }
}
function rewardText(rw) {
  const p = [];
  for (const k of ['ore', 'ice', 'data']) if (rw[k]) p.push(`+${fmt(rw[k])} ${RES_NAME[k]}`);
  if (rw.ships) for (const k in rw.ships) p.push(`+${rw.ships[k]} ${shipName(k, rw.ships[k])}`);
  return p.join(', ');
}

/* ================= journal ================= */
function log(k, m) {
  st.log.unshift({ t: st.t, k, m }); if (st.log.length > 80) st.log.length = 80;
  if (live) { if (!['build', 'research', 'yard'].includes(k)) toast(m, k); if (k === 'raid') sfx('alert'); } else if (awayLog) awayLog.push({ k, m });
}
function bump() { ver++; dirty = true; }

/* ================= sauvegarde ================= */
function saveNow() {
  if (!st || !st.founded) return;
  lastSavedAt = Date.now();
  try { localStorage.setItem(LS_SAVE, JSON.stringify({ v: 1, savedAt: lastSavedAt, state: st })); } catch (e) { /* stockage indisponible */ }
  queueCloud();
}
function scheduleSave() { if (saveTimer) return; saveTimer = setTimeout(() => { saveTimer = null; saveNow(); }, 1500); }
function queueCloud() {
  if (!cloud || cloud.timer) return;
  const wait = Math.max(0, 8000 - (Date.now() - cloud.last));
  cloud.timer = setTimeout(() => { if (cloud) cloud.timer = null; flushCloud(); }, wait);
}
async function flushCloud() {
  if (!cloud || !st.founded) return;
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true; cloud.last = Date.now();
  try {
    await cloud.ref.set({ v: 1, savedAt: lastSavedAt || Date.now(), json: JSON.stringify(st) });
    saveMode = 'cloud';
  } catch (e) {
    const code = e && e.code;
    if (['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed', 'quota_exceeded', 'transform_error'].includes(code)) { cloud = null; saveMode = 'local'; }
    else if (cloud) cloud.again = true;
  } finally {
    if (cloud) { cloud.busy = false; if (cloud.again) { cloud.again = false; queueCloud(); } }
    updateSaveMode();
  }
}
async function initCloud() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.collection('data/users/' + uid).doc('save');
    const snap = await ref.get();
    cloud = { ref, busy: false, again: false, last: 0, timer: null };
    let remote = null;
    if (snap.exists) { const d = snap.data(); if (d && typeof d.json === 'string') { try { remote = { savedAt: +d.savedAt || 0, state: JSON.parse(d.json) }; } catch (e) { remote = null; } } }
    saveMode = 'cloud';
    if (remote && remote.state && remote.state.v === 1 && remote.state.founded && (!st.founded || remote.savedAt > lastSavedAt)) adopt(remote.state, remote.savedAt);
    else if (st.founded && (!remote || lastSavedAt > remote.savedAt)) flushCloud();
    updateSaveMode();
  } catch (e) { cloud = null; }
}
function adopt(s, savedAt) {
  st = migrate(s); lastSavedAt = savedAt;
  if (modalKind === 'welcome') closeModal();
  catchUp(true);
  saveLocalOnly();
  renderAll();
}
function saveLocalOnly() { try { localStorage.setItem(LS_SAVE, JSON.stringify({ v: 1, savedAt: lastSavedAt, state: st })); } catch (e) { /* ignoré */ } }
function updateSaveMode() {
  const txt = saveMode === 'cloud' ? 'Partie enregistrée sur votre compte, sur tous vos appareils' : 'Partie enregistrée dans ce navigateur';
  $$('[data-bind="savemode"]').forEach(el => { el.textContent = txt; });
}

const PHOTO = {};
let photosReady = false, photosStarted = false;
function loadPhotos() {
  if (photosStarted) return;
  photosStarted = true;
  document.documentElement.style.setProperty('--img-carina', `url("${PHOTO_SRC.carina}")`);
  const keys = Object.keys(PHOTO_SRC); let left = keys.length;
  for (const k of keys) {
    const im = new Image();
    im.onload = im.onerror = () => { if (--left === 0) { photosReady = true; paintThumbs(); } };
    im.src = PHOTO_SRC[k]; PHOTO[k] = im;
  }
}
function drawCover(ctx, img, w, h, fx, fy, zoom) {
  if (!img || !img.naturalWidth) { ctx.fillStyle = PAL.void; ctx.fillRect(0, 0, w, h); return; }
  const iw = img.naturalWidth, ih = img.naturalHeight, sc = Math.max(w / iw, h / ih) * (zoom || 1), sw = w / sc, sh = h / sc;
  const sx = Math.max(0, Math.min(iw - sw, fx * iw - sw / 2)), sy = Math.max(0, Math.min(ih - sh, fy * ih - sh / 2));
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
}
function veil(ctx, w, h, a) { ctx.fillStyle = `rgba(6,10,20,${a})`; ctx.fillRect(0, 0, w, h); }
function groundPhoto(ctx, w, h, R, gy) {
  const im = PHOTO.apollo;
  if (!im || !im.naturalWidth) { groundC(ctx, w, h, R, gy); return; }
  const iw = im.naturalWidth, ih = im.naturalHeight, ph = (h - gy) / 0.8, sc = ph / ih;
  const sw = Math.min(iw * 0.74, w / sc), sx = R() * Math.max(0, iw * 0.74 - sw), top = gy - ph * 0.2;
  ctx.save();
  ctx.globalCompositeOperation = 'screen'; ctx.drawImage(im, sx, 0, sw, ih, 0, top, w, ph);
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#7C8FB2'; ctx.fillRect(0, gy - ph * 0.12, w, h - gy + ph * 0.12);
  ctx.restore();
  const g = ctx.createLinearGradient(0, gy, 0, h); g.addColorStop(0, 'rgba(11,15,22,0)'); g.addColorStop(1, 'rgba(11,15,22,.6)');
  ctx.fillStyle = g; ctx.fillRect(0, gy, w, h - gy);
}

function ri(k) { return `<svg class="ri" viewBox="0 0 16 16" aria-hidden="true">${RICON[k] || ''}</svg>`; }
function medal(name) { return `<span class="medal">${svg(name)}</span>`; }
function reqPills(req) {
  if (!req) return '';
  const items = [];
  for (const k in req.b || {}) { const ok = lvl(k) >= req.b[k]; items.push(`<span class="pill ${ok ? 'ok' : 'no'}">${ok ? '✓ ' : ''}${esc(MOD[k].name)} ${req.b[k]}</span>`); }
  for (const k in req.t || {}) { const ok = tech(k) >= req.t[k]; items.push(`<span class="pill ${ok ? 'ok' : 'no'}">${ok ? '✓ ' : ''}${esc(TECH[k].name)} ${req.t[k]}</span>`); }
  return `<div class="req"><span>Il faut</span>${items.join('')}</div>`;
}
function costHtml(c, t) {
  return `<div class="price">${Object.entries(c).map(([k, v]) => `<span class="cost" data-k="${k}" data-v="${v}" style="--c:var(--${k})" title="${RES_NAME[k]}">${ri(k)}${fmt(v)}</span>`).join('')}${t != null ? `<span class="dur" title="Durée">${ri('time')}${fmtDur(t)}</span>` : ''}</div>`;
}
function resChips(o) { return Object.entries(o).filter(([, v]) => v > 0).map(([k, v]) => `<span class="cost" style="--c:var(--${k})" title="${RES_NAME[k]}">${ri(k)}${fmt(v)}</span>`).join(''); }
function rewardChips(rw) {
  if (!rw) return '';
  const res = {}; for (const k of ['ore', 'ice', 'data']) if (rw[k]) res[k] = rw[k];
  let h = resChips(res);
  if (rw.ships) for (const k in rw.ships) h += `<span class="pill">+${rw.ships[k]} ${shipName(k, rw.ships[k])}</span>`;
  return h ? `<div class="rewards">${h}</div>` : '';
}
function gainHtml(from, to, unit, note) {
  return `<div class="gain">${from != null ? `<span class="from">${from}</span><span class="arrow" aria-hidden="true">→</span>` : ''}<span class="to">${to}</span>${unit ? `<span class="unit">${unit}</span>` : ''}${note ? `<small>${note}</small>` : ''}</div>`;
}
function modEffect(id, a, b) {
  const m = MOD[id], sp = st.speed, sm = staffMul(), f = a > 0;
  const red = l => Math.round((1 - 0.88 ** l) * 100) + NBSP + '%';
  switch (id) {
    case 'drill': return gainHtml(f ? fmt(m.prod(a) * sp) : null, fmt(m.prod(b) * sp), 'minerai par heure', `Au niveau ${b} : ${fmt(m.energy(b))} d’énergie et ${fmt(m.staff(b) * sm)} colons`);
    case 'ice': return gainHtml(f ? fmt(m.prod(a) * sp) : null, fmt(m.prod(b) * sp), 'glace par heure', `Au niveau ${b} : ${fmt(m.energy(b))} d’énergie et ${fmt(m.staff(b) * sm)} colons`);
    case 'sail': { const k = 1 + 0.08 * tech('photon'); return gainHtml(f ? fmt(m.out(a) * k) : null, fmt(m.out(b) * k), 'd’énergie', `Au niveau ${b} : ${fmt(m.staff(b) * sm)} colons`); }
    case 'hab': { const tf = 1 + 0.1 * tech('terra'); return gainHtml(fmt(m.cap(a) * tf), fmt(m.cap(b) * tf), 'colons au maximum'); }
    case 'lab': return gainHtml(f ? fmt(m.prod(a) * sp) : null, fmt(m.prod(b) * sp), 'données par heure', `Recherches ${b * 10}${NBSP}% plus rapides · ${fmt(m.energy(b))} d’énergie · ${fmt(m.staff(b) * sm)} colons`);
    case 'depot': return gainHtml(fmt(m.store(a)), fmt(m.store(b)), 'de capacité', 'Pour le minerai comme pour la glace.');
    case 'works': return gainHtml(f ? '−' + red(a) : null, '−' + red(b), 'sur la durée des chantiers');
    case 'yard': return b > 1 ? gainHtml(a > 1 ? '+' + (a - 1) * 20 + NBSP + '%' : null, '+' + (b - 1) * 20 + NBSP + '%', 'de cadence') : gainHtml(null, 'Débloque', 'les premiers vaisseaux');
    case 'radar': return gainHtml(String(a + 1), String(b + 1), 'sauts de portée', `Raids repérés ${fmtDur(warnMsAt(b))} avant leur arrivée`);
    case 'bastion': return gainHtml(f ? fmt(m.atk(a)) : null, fmt(m.atk(b)), 'de puissance de feu', `Coque au niveau ${b} : ${fmt(m.hull(b))}`);
    case 'beacon': return gainHtml(pct(lumAt(a)), pct(lumAt(b)), 'd’éclat pour Vesper');
  }
