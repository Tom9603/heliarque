<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Héliarque">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25' r='75%25'%3E%3Cstop offset='0' stop-color='%2300E5FF'/%3E%3Cstop offset='.55' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%230B1B36'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='20' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='32' rx='30' ry='8' fill='none' stroke='%2300E5FF' stroke-width='3' transform='rotate(-20 32 32)'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Héliarque</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jeu de stratégie spatiale par navigateur : bâtissez une station autour d’une étoile mourante.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Mise en page : application mobile compacte. Barre de ressources collante en haut, ligne d’activité seulement si besoin, listes de lignes de 72 px avec l’action sur la ligne, onglets internes, barre d’onglets fine en bas, fiches qui montent du bas. Colonne centrée de 640 px sur grand écran. Palette fournie, thème sombre unique par choix. */
  --void:#0B0F16;
  --sky:#0F1E2E;
  --hud:#0C1622;
  --card:#0F1E2E;
  --card-2:#152A42;
  --card-3:#1F3B5B;
  --line:#1A3150;
  --ink:#E8EEF7;
  --ink-2:#A3ABB8;
  --ink-3:#7A8394;
  --vesper:#3B82F6;
  --vesper-2:#00E5FF;
  --on-accent:#061322;
  --on-medal:#08111D;
  --ore:#9CA3AF;
  --ice:#00E5FF;
  --data:#A855F7;
  --energy:#F59E0B;
  --pop:#22C55E;
  --danger:#EF4444;
  --ok:#22C55E;
  --star:rgba(255,255,255,.6);
  --hl:rgba(255,255,255,.34);
  --shade:rgba(10,8,30,.28);
  --scrim:rgba(4,8,16,.62);
  --shadow:rgba(2,4,12,.55);
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:var(--f-body);
  --nav-h:56px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hud)}
h1,h2,h3,h4{font-family:var(--f-body);margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation}
input{font:inherit}
.muted{color:var(--ink-3)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--vesper-2);outline-offset:2px}
.ri{width:14px;height:14px;flex:none;color:var(--c);fill:currentColor}

/* ---------- barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hud);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:4px;padding-block:5px}
.res{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;min-width:0}
.r{appearance:none;border:0;background:none;color:var(--ink);padding:5px 3px 4px;border-radius:9px;display:grid;gap:4px;min-width:0;cursor:pointer;text-align:left;--c:var(--ink-2)}
.r:active{background:var(--card)}
.r .top2{display:flex;align-items:center;gap:4px;min-width:0}
.r .v{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .meter{height:2px;border-radius:2px;background:var(--card-3);overflow:hidden}
.r .meter i{display:block;height:100%;width:0;background:var(--c);transition:width .8s linear}
.r.nometer .meter{visibility:hidden}
.r.full .v{color:var(--energy)}
.r.warn .v{color:var(--danger)}
.gear{appearance:none;flex:none;width:36px;height:36px;margin-right:-6px;border-radius:10px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;cursor:pointer}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.strip::-webkit-scrollbar{display:none}
.strip:empty{display:none}
.chipx{appearance:none;flex:none;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 9px;border-radius:999px;border:0;background:var(--card);color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;--c:var(--vesper-2)}
.chipx svg{width:15px;height:15px;fill:none;stroke:var(--c);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;flex:none}
.chipx .cl{max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--ink-2)}
.chipx .muted{font-weight:600}
.chipx .cbar{position:absolute;left:0;right:0;bottom:0;height:2px}
.chipx .cbar i{display:block;height:100%;width:0;background:var(--c)}
.chipx.raid{background:color-mix(in oklab,var(--danger) 28%,var(--card));--c:var(--danger)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,var(--danger))}
.chipx.raid .dot,.alert.raid .dot{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- écrans ---------- */
.app{padding-block:14px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:10px;min-width:0}
.vh{display:flex;align-items:center;gap:10px;min-width:0}
.vh span{margin-left:auto}
.vh h1{font-size:22px;font-weight:800;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vh span{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.segs{display:flex;gap:3px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:11px}
.segs button{appearance:none;flex:1;border:0;background:none;color:var(--ink-3);font-size:13.5px;font-weight:700;min-height:34px;border-radius:8px;cursor:pointer}
.segs button[aria-pressed="true"]{background:var(--card-3);color:var(--ink)}
.quest{appearance:none;width:100%;border:0;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;align-items:center;padding:9px 12px;border-radius:12px;background:linear-gradient(100deg,color-mix(in oklab,var(--vesper) 26%,var(--card)),var(--card));color:var(--ink)}
.quest-k{grid-row:span 2;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--vesper-2)}
.quest-t{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quest-d{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#alerts{display:grid;gap:6px}
#alerts:empty{display:none}
.alert{appearance:none;width:100%;border:0;text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:11px;background:color-mix(in oklab,var(--c) 16%,var(--card));color:var(--ink);font-size:13px}
.alert b{font-weight:800}
.note{font-size:13.5px;color:var(--ink-2);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.empty{color:var(--ink-3);font-size:13.5px}
.hint-s{font-size:12.5px;color:var(--ink-3);text-align:center}
.sub-h{font-size:15px;font-weight:800;margin-top:4px}

/* ---------- lignes ---------- */
.list{display:grid;gap:8px}
.row{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0;--c:var(--ink-2)}
.row.busy{border-color:color-mix(in oklab,var(--vesper-2) 55%,var(--line))}
.row-main{appearance:none;border:0;background:none;color:inherit;padding:0;display:flex;align-items:center;gap:11px;flex:1;min-width:0;text-align:left;cursor:pointer}
.rthumb{position:relative;width:54px;height:54px;flex:none;border-radius:11px;overflow:hidden;background:linear-gradient(180deg,var(--card-2),var(--void))}
.rthumb img,.rthumb svg{width:100%;height:100%;display:block;object-fit:cover}
.rthumb img:not([src]){visibility:hidden}
.rlv{position:absolute;right:3px;bottom:3px;min-width:19px;height:17px;padding:0 5px;border-radius:999px;background:rgba(6,10,18,.85);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 65%,transparent)}
.rtext{display:grid;gap:2px;min-width:0}
.rname{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq{font-size:11.5px;font-weight:800;color:var(--vesper-2)}
.rsub{font-size:12.5px;font-weight:600;color:color-mix(in oklab,var(--c) 60%,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.locked .rsub{color:var(--ink-3);font-weight:500}
.row.locked .rthumb img{filter:grayscale(.85) brightness(.55)}
.row.locked .rname{color:var(--ink-2)}
.rcost{display:flex;gap:9px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.cm{display:inline-flex;align-items:center;gap:3px}
.cm .ri{width:11px;height:11px}
.cm.short{color:var(--danger)}
.up{appearance:none;flex:none;min-width:62px;height:46px;padding:0 8px;border-radius:12px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card-2);color:var(--ink-3);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.up svg{width:15px;height:15px;fill:currentColor}
.up .ic-wait{display:none;fill:none;stroke:currentColor;stroke-width:1.8}
.up:disabled:not([data-block]) .ic-up{display:none}
.up:disabled:not([data-block]) .ic-wait{display:block}
.up.go{background:linear-gradient(135deg,var(--vesper-2),var(--vesper));color:var(--on-accent)}
.up.soft{background:var(--card-3);color:var(--ink);font-size:12px}
.up:disabled{cursor:not-allowed}
.act-lock,.act-done{flex:none;width:46px;height:46px;display:grid;place-items:center;color:var(--ink-3);font-weight:800}
.act-lock svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.act-done{color:var(--ok)}
.rbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--card-3)}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vesper),var(--vesper-2))}

/* ---------- éléments partagés ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.sheet .panel{background:var(--card)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.panel-h h3{font-size:14.5px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--card-2);font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.jobs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.job{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;--c:var(--vesper)}
.mini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--c) 22%,var(--card-2))}
.mini svg{width:18px;height:18px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.job-main{min-width:0;display:grid;gap:5px}
.job-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.job-n{font-weight:700;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.job-n .muted{font-weight:500}
.eta{font-weight:800;font-size:13px;white-space:nowrap}
.eta.muted{color:var(--ink-3);font-weight:500}
.bar{height:5px;border-radius:5px;background:var(--card-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--vesper),var(--vesper-2))}
.x{appearance:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--card-2);color:var(--ink-3);cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.chip b{color:var(--ink)}
.duo2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat2{display:grid;gap:1px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.stat2 span{font-size:12px;color:var(--ink-3)}
.stat2 b{font-size:20px;font-weight:800}
.medal{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,color-mix(in oklab,var(--c) 50%,white) 0%,var(--c) 50%,color-mix(in oklab,var(--c) 55%,var(--void)) 100%)}
.medal svg{width:21px;height:21px;fill:none;stroke:var(--on-medal);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.desc{color:var(--ink-2);font-size:13.5px}
.gain{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 7px;padding:10px 12px;border-radius:12px;background:var(--card)}
.gain .from{color:var(--ink-3);font-weight:700}
.gain .arrow{color:var(--ink-3)}
.gain .to{font-weight:800;font-size:19px;color:color-mix(in oklab,var(--c,var(--vesper-2)) 70%,var(--ink))}
.gain .unit{color:var(--ink-2);font-size:13px}
.gain small{flex-basis:100%;color:var(--ink-3);font-size:12px;margin-top:2px}
.done-note{color:var(--ok);font-weight:700}
.req{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.req .pill.ok{color:var(--ok)}
.req .pill.no{color:var(--ink);background:color-mix(in oklab,var(--danger) 22%,var(--card-2))}
.price{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cost,.dur{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--card);font-size:13.5px;font-weight:700;color:var(--ink);--c:var(--ink-2)}
.cost.short{color:var(--danger);box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--danger) 50%,transparent)}
.dur{color:var(--ink-2);font-weight:600;--c:var(--ink-3);background:transparent;padding-left:2px}
.wait{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:-4px}
.wait:empty{display:none}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;gap:5px;align-items:baseline;padding:4px 10px;border-radius:999px;background:var(--card);font-size:12.5px;color:var(--ink-3)}
.stat b{color:var(--ink);font-weight:800}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.quick{display:flex;gap:5px}
.chipbtn{appearance:none;flex:1;min-height:40px;padding:0 11px;border-radius:999px;background:var(--card);border:0;color:var(--ink-2);font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn{appearance:none;cursor:pointer;border:0;border-radius:12px;background:var(--card-2);color:var(--ink);font-family:var(--f-body);font-weight:800;font-size:15px;padding:0 18px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active:not(:disabled){transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,var(--vesper-2),var(--vesper));color:var(--on-accent)}
.btn.danger{background:color-mix(in oklab,var(--danger) 18%,var(--card-2));color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;border-radius:12px;background:var(--card);overflow:hidden}
.stepper button{appearance:none;min-height:42px;background:transparent;border:0;color:var(--ink);font-size:21px;cursor:pointer}
.stepper input{border:0;background:transparent;text-align:center;font-weight:800;font-size:17px;color:var(--ink);min-width:0;width:100%;-moz-appearance:textfield;appearance:textfield}
.stepper.sm{grid-template-columns:36px 40px 36px}
.stepper.sm button{min-height:38px;font-size:19px}
.stepper.sm input{font-size:16px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field{display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.field input{background:var(--card);border:2px solid transparent;border-radius:12px;color:var(--ink);font-size:16px;font-weight:700;padding:10px 12px;min-height:48px;width:100%}
.field input:focus{border-color:var(--vesper);outline:none}

/* ---------- carte ---------- */
.map-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(rgba(11,15,22,.6),rgba(11,15,22,.78)),var(--img-carina,none) center/cover,var(--void)}
.map{width:100%;height:auto;display:block;touch-action:manipulation}
.bg-star{fill:var(--star)}
.orbit{fill:none;stroke:color-mix(in oklab,var(--ink) 8%,transparent);stroke-width:1}
.range{fill:color-mix(in oklab,var(--vesper) 6%,transparent);stroke:color-mix(in oklab,var(--vesper) 55%,transparent);stroke-width:1.3;stroke-dasharray:4 6}
.body{cursor:pointer;outline:none}
.body .hit{fill:transparent}
.body:focus-visible .hit{stroke:var(--vesper-2);stroke-width:2}
.f-ore{fill:var(--ore)}.f-ice{fill:var(--ice)}.f-data{fill:var(--data)}.f-danger{fill:var(--danger)}.f-vesper{fill:var(--vesper)}.f-pop{fill:var(--pop)}
.dim{opacity:.72}
.hl{fill:var(--hl)}
.b-sel{fill:color-mix(in oklab,var(--energy) 14%,transparent);stroke:var(--energy);stroke-width:2}
.b-tgt{fill:none;stroke:var(--energy);stroke-width:1.5;stroke-dasharray:3 4}
.b-q{fill:var(--ink-3);font-size:11px;font-weight:800;text-anchor:middle;font-family:var(--f-body)}
.b-dust{fill:color-mix(in oklab,var(--ink) 30%,transparent)}
.b-lvl{fill:#fff;font-size:10px;font-weight:800;text-anchor:middle;font-family:var(--f-body)}
.b-out{stroke:var(--void);stroke-width:1.5}
.b-dome{fill:var(--void)}
.trail{stroke:var(--energy);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round;opacity:.75;fill:none}
.fdot{fill:var(--energy);transition:transform 1s linear}
.planet{background:radial-gradient(circle,color-mix(in oklab,var(--ink) 7%,transparent),transparent 70%)}
.facts{display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.facts b{color:var(--ink)}
.missions{display:grid;gap:8px}
.mission .hint{font-size:12.5px;color:var(--ink-3);margin-top:4px;text-align:center}

/* ---------- journal ---------- */
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.qlist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.qlist li:last-child{border-bottom:0}
.qcheck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--card-3);font-size:12px;font-weight:800;color:var(--on-accent)}
.qlist li.done .qcheck{background:var(--ok);border-color:var(--ok)}
.qlist li.cur .qcheck{border-color:var(--vesper-2);box-shadow:0 0 0 3px color-mix(in oklab,var(--vesper-2) 22%,transparent)}
.qlist h4{font-size:14px;font-weight:700}

function rates() {

const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
function hexDist(q, r) { return (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2; }
const NAMES = {
  wreck: ['Tarsis', 'Mélusine', 'Anse-Bleue', 'Corvidé', 'Pénitence', 'Saint-Elme', 'Lumen', 'Ondine', 'Héron', 'Calliope'],
  nest: ['Nid de la Faille', 'Repaire Mâchefer', 'Nid Écarlate', 'Antre Sans-Lune', 'Nid des Cendres', 'Repaire Rouille', 'Nid Vipère', 'Antre du Croc'],
  anomaly: ['Signal fantôme', 'Écho de Vesper', 'Balise muette', 'Sphère froide', 'Distorsion Hélix', 'Murmure gravitationnel'],
};
function corsairComp(P, R) {
  const pw = k => PIRATE[k].atk + PIRATE[k].hull / 4;
  const c = { skiff: 0, breaker: 0, maw: 0 }; let rem = P;
  if (P > 5000) { c.maw = Math.floor(rem * (0.3 + 0.2 * R()) / pw('maw')); rem -= c.maw * pw('maw'); }
  if (P > 800) { c.breaker = Math.floor(rem * (0.4 + 0.2 * R()) / pw('breaker')); rem -= c.breaker * pw('breaker'); }
  c.skiff = Math.max(1, Math.round(rem / pw('skiff')));
  return c;
}
function genMap(seed) {
  const R = makeRng(seed); const cells = {};
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  for (let q = -RADIUS; q <= RADIUS; q++) {
    for (let r = Math.max(-RADIUS, -q - RADIUS); r <= Math.min(RADIUS, -q + RADIUS); r++) {
      const d = hexDist(q, r); const c = { q, r, d, type: 'empty' };
      if (d === 0) { c.type = 'home'; c.known = true; }
      else {
        const x = R(); const pn = d >= 2 ? 0.06 + 0.04 * d : 0;
        if (x < pn) c.type = 'nest';
        else if (x < pn + 0.23) c.type = 'asteroid';
        else if (x < pn + 0.40) c.type = 'comet';
        else if (x < pn + 0.50) c.type = 'wreck';
        else if (x < pn + 0.58) c.type = 'anomaly';

      cells[q + ',' + r] = c;
    }
  }
  const ring1 = shuffle(Object.values(cells).filter(c => c.d === 1));
  if (!ring1.some(c => c.type === 'asteroid')) ring1[0].type = 'asteroid';
  if (!ring1.some(c => c.type === 'comet')) ring1.find(c => c.type !== 'asteroid').type = 'comet';
  const ring2 = Object.values(cells).filter(c => c.d === 2);
  if (!ring2.some(c => c.type === 'nest')) shuffle(ring2)[0].type = 'nest';
  let nests = Object.values(cells).filter(c => c.type === 'nest').length;
  for (const c of shuffle(Object.values(cells).filter(c => c.d >= 3 && c.type === 'empty'))) { if (nests >= 4) break; c.type = 'nest'; nests++; }

    else if (c.type === 'comet') { c.ice = Math.round(2000 * (1 + 0.8 * d) * f()); c.name = `Comète C/${10 + Math.floor(R() * 89)}`; }
    else if (c.type === 'wreck') { c.ore = Math.round(600 * (1 + d) * f()); c.ice = Math.round(400 * (1 + d) * f()); c.data = Math.round(60 * (1 + d) * f()); c.name = `Épave « ${pick(NAMES.wreck)} »`; }
    else if (c.type === 'anomaly') { c.data = Math.round(180 * d * (0.8 + 0.4 * R())); c.name = pick(NAMES.anomaly); }
    else if (c.type === 'nest') {
      c.lvl = Math.max(1, Math.min(6, Math.round(d * 1.1 + R() * 1.2 - 1.2)));
      c.garrison = corsairComp(110 * 2.1 ** (c.lvl - 1), R);
      c.loot = { ore: 900 * 2 ** c.lvl, ice: 700 * 2 ** c.lvl, data: 120 * 2 ** c.lvl };
      c.name = nestNames.pop() || 'Nid corsaire';
    }
  }
  return cells;
}

/* ================= combat ================= */

/* ================= flottes ================= */

const PHOTO = {};
let photosReady = false, photosStarted = false;
function loadPhotos() {
  if (photosStarted) return;
  photosStarted = true;
  document.documentElement.style.setProperty('--img-carina', `url("${PHOTO_SRC.carina}")`);
  const keys = Object.keys(PHOTO_SRC); let left = keys.length;
  for (const k of keys) {
    const im = new Image();
    im.onload = im.onerror = () => { if (--left === 0) { photosReady = true; paintThumbs(); } };
    im.src = PHOTO_SRC[k]; PHOTO[k] = im;
  }
}

    const c = st.map[f.k], [tx, ty] = hexXY(c.q, c.r);
    const p = f.phase === 'out' ? clamp01((now - f.depart) / (f.arrive - f.depart)) : f.p0 * (1 - clamp01((now - f.bs) / (f.back - f.bs)));
    el.style.transform = `translate(${(tx * p).toFixed(1)}px,${(ty * p).toFixed(1)}px)`;
  }
}

/* ================= interactions ================= */
function act(fn) { advanceTo(Date.now()); const r = fn(); bump(); checkQuests(); flush(true); scheduleSave(); return r; }
function setTab(id) {
  if (!VIEWS[id]) return;
  tab = id; try { localStorage.setItem(LS_TAB, id); } catch (e) { /* ignoré */ }
  renderDock(); renderView(true); updateDynamic();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
const release = () => setTimeout(() => { pointerDown = false; if (dirty || pendingView) flush(); }, 60);
document.addEventListener('pointerup', release, true);
document.addEventListener('pointercancel', release, true);
document.addEventListener('click', e => {
  const modal = $('#modal');
  if (e.target === modal && modalKind && modalKind !== 'welcome') { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': setTab(id); break;
    case 'item': openItem(el.dataset.kind, id); break;
    case 'seg': seg[el.dataset.k] = el.dataset.v; renderView(true); updateDynamic(); break;
    case 'activity': openActivity(); break;
    case 'res': openRes(); break;
    case 'ships1': act(() => doShips(id, 1)); break;
    case 'build': act(() => doBuild(id)); break;
    case 'cancel-build': act(() => { st.q.build = cancelQueue(st.q.build, +el.dataset.i, 'build'); }); break;
    case 'research': act(() => doResearch(id)); break;
    case 'cancel-research': act(() => { st.q.research = cancelQueue(st.q.research, +el.dataset.i, 'research'); }); break;
    case 'ships': act(() => doShips(id, qty[id] || 1)); break;
    case 'cancel-yard': act(() => cancelYard(+el.dataset.i)); break;
    case 'qty-step': qty[id] = clampInt((qty[id] || 1) + (+el.dataset.d), 1, 9999); refreshShipCard(id, true); break;
    case 'qty-set': qty[id] = el.dataset.v === 'max' ? Math.max(1, maxAfford(id)) : clampInt(el.dataset.v, 1, 9999); refreshShipCard(id, true); break;
    case 'cell': openCell(el.dataset.k); break;
    case 'mission': openFleet(el.dataset.k, el.dataset.m); break;
    case 'fc-step': if (fc) { fc.sel[id] = clampInt((fc.sel[id] || 0) + (+el.dataset.d), 0, st.ships[id] || 0); refreshFc(true); } break;
    case 'fc-max': if (fc) { fc.sel[id] = st.ships[id] || 0; refreshFc(true); } break;
    case 'launch': if (fc) act(() => { if (launch()) closeModal(); }); break;
    case 'recall': act(() => recall(+id)); break;
    case 'settings': openSettings(); break;
    case 'close': closeModal(); break;
    case 'found': {
      const name = ($('#w-name') || {}).value; const sp = +(($('input[name="w-speed"]:checked') || {}).value || 4);
      closeModal(); act(() => found(name, sp)); saveNow(); break;
    }
    case 'save-settings': {
      const name = (($('#s-name') || {}).value || '').trim(); const sp = +(($('input[name="s-speed"]:checked') || {}).value || st.speed);
      act(() => { if (name) st.name = name.slice(0, 24); if (sp !== st.speed) { st.speed = sp; log('info', `Vitesse du temps réglée sur ×${sp}.`); } });
      closeModal(); break;
    }
    case 'reset-ask': $('#dz').innerHTML = `<p style="font-size:13.5px">Toute la progression de ${esc(st.name)} sera effacée.</p><div class="sheet-actions"><button class="btn" data-act="reset-no">Garder ma partie</button><button class="btn danger" data-act="reset-yes">Tout effacer</button></div>`; break;
    case 'reset-no': $('#dz').innerHTML = '<button class="btn danger block" data-act="reset-ask">Recommencer une partie</button>'; break;
    case 'reset-yes': {
      closeModal(); st = newGame(); sel = null; tab = 'station';
      try { localStorage.removeItem(LS_SAVE); } catch (e) { /* ignoré */ }
      renderAll(true); openWelcome(); break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalKind && modalKind !== 'welcome') { closeModal(); return; }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t instanceof SVGElement && t.dataset && t.dataset.act) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.qty) { qty[t.dataset.qty] = clampInt(t.value || 1, 1, 9999); refreshShipCard(t.dataset.qty, false); }
  if (t.dataset && t.dataset.fc && fc) { fc.sel[t.dataset.fc] = clampInt(t.value || 0, 0, st.ships[t.dataset.fc] || 0); refreshFc(false); }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset && t.dataset.qty) t.value = qty[t.dataset.qty] || 1;
  if (t.dataset && t.dataset.fc && fc) t.value = fc.sel[t.dataset.fc] || 0;
});
const persist = () => { if (st && st.founded) { advanceTo(Date.now()); saveNow(); } };
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persist(); else tick(); });

/* ================= boucle ================= */
function tick() {
  if (!st) return;
  const v0 = ver;
  advanceTo(Date.now());
  checkQuests();
  const th = threatVisible();
  if (th !== threatShown) { threatShown = th; dirty = true; if (th && live && st.raid) toast(`Raid corsaire détecté : ${listText(st.raid.comp, PIRATE)}. Arrivée dans ${fmtDur(st.raid.at - Date.now())}.`, 'raid'); }
  if (ver !== v0) scheduleSave();
  if (dirty || pendingView) flush(); else updateDynamic();
  if (st.won && !st.wonSeen && !modalKind) openVictory();
}
function catchUp(report) {
  const from = st.t, now = Date.now();
  if (now - st.t > 30 * 24 * HOUR) st.t = now - 30 * 24 * HOUR;
  live = false; awayLog = [];
  advanceTo(now); checkQuests();
  const items = awayLog; awayLog = null; live = true;
  threatShown = threatVisible();
  if (report && st.founded && now - from > 2 * MIN && items.length && !modalKind) openAway(now - from, items);
}

/* ================= étoile ================= */
function initStar() {
  const cv = $('#star'); if (!cv) return; const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const voidHex = getComputedStyle(document.documentElement).getPropertyValue('--void').trim() || '#0b1114';
  const vr = parseInt(voidHex.slice(1, 3), 16), vg = parseInt(voidHex.slice(3, 5), 16), vb = parseInt(voidHex.slice(5, 7), 16);
  const R0 = makeRng(7);
  const cells = Array.from({ length: 30 }, () => ({ a: R0() * 6.283, d: Math.sqrt(R0()), s: (R0() - 0.5) * 0.00005, z: 0.08 + R0() * 0.16, ph: R0() * 6.283 }));
  let W = 0, H = 0, last = 0;
  function resize() { const dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  const lerp = (a, b, t) => a + (b - a) * t;
  function draw(ts) {
    if (!reduce) requestAnimationFrame(draw);
    if (ts - last < 40 && !reduce) return; last = ts;
    if (!W || cv.width === 0) resize();
    const L = st ? lumAt(lvl('beacon')) : 0.12;
    ctx.clearRect(0, 0, W, H);
    const R = Math.max(130, H * 1.3), cx = W - R * 0.38, cy = H * 0.78;
    const core = [255, lerp(150, 238, L), lerp(90, 200, L)].map(Math.round);
    const rim = [lerp(170, 255, L), lerp(40, 130, L), lerp(22, 70, L)].map(Math.round);
    const pulse = reduce ? 0 : Math.sin(ts * 0.0007) * 0.05;
    const glow = ctx.createRadialGradient(cx, cy, R * 0.85, cx, cy, R * (1.6 + L * 0.6));
    glow.addColorStop(0, `rgba(${rim.join(',')},${0.3 + 0.3 * L + pulse})`); glow.addColorStop(1, `rgba(${rim.join(',')},0)`);
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    const disk = ctx.createRadialGradient(cx - R * 0.25, cy - R * 0.32, R * 0.05, cx, cy, R);
    disk.addColorStop(0, `rgb(${core.join(',')})`); disk.addColorStop(0.65, `rgb(${rim.join(',')})`); disk.addColorStop(1, `rgb(${rim.map(v => Math.round(v * 0.5)).join(',')})`);
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = disk; ctx.fill(); ctx.clip();
    for (const c of cells) {
      const a = c.a + (reduce ? 0 : ts * c.s), x = cx + Math.cos(a) * c.d * R * 0.95, y = cy + Math.sin(a) * c.d * R * 0.95;
      const rr = R * c.z * (1 + (reduce ? 0 : 0.18 * Math.sin(ts * 0.0011 + c.ph)));
      const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
      g.addColorStop(0, `rgba(255,232,190,${0.12 + 0.1 * L})`); g.addColorStop(1, 'rgba(255,210,160,0)');
      ctx.fillStyle = g; ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    ctx.restore();
    const fade = ctx.createLinearGradient(0, 0, W, 0);
    fade.addColorStop(0, `rgba(${vr},${vg},${vb},0.96)`); fade.addColorStop(0.45, `rgba(${vr},${vg},${vb},0.72)`); fade.addColorStop(0.8, `rgba(${vr},${vg},${vb},0)`);
    ctx.fillStyle = fade; ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', () => { resize(); if (reduce) draw(performance.now()); });
  resize(); requestAnimationFrame(draw);
}

/* ================= démarrage ================= */
function boot(hot) {
  let s = null, savedAt = 0;
  if (hot && hot.state && hot.state.v === 1) { s = hot.state; savedAt = hot.savedAt || Date.now(); if (hot.tab && VIEWS[hot.tab]) tab = hot.tab; if (hot.sel) sel = hot.sel; }
  else {
    try { const raw = localStorage.getItem(LS_SAVE); if (raw) { const d = JSON.parse(raw); if (d && d.state && d.state.v === 1) { s = d.state; savedAt = d.savedAt || 0; } } } catch (e) { s = null; }
    try { const t = localStorage.getItem(LS_TAB); if (t && VIEWS[t]) tab = t; } catch (e) { /* ignoré */ }
  }
  if (s) { st = migrate(s); lastSavedAt = savedAt; catchUp(!(hot && hot.state)); }
  else st = newGame();
  live = true;
  renderAll(true);
  initStar();
  setInterval(tick, 1000);
  if (!st.founded) openWelcome();
  else if (st.won && !st.wonSeen && !modalKind) openVictory();
  initCloud();
}
const H = window.claude && window.claude.hot;
if (H && typeof H.snapshot === 'function') { try { H.snapshot(() => ({ state: st, savedAt: lastSavedAt, tab, sel })); } catch (e) { /* ignoré */ } }
if (H && typeof H.ready === 'function') H.ready(boot); else boot((H && H.data) || {});
})();
</script>
