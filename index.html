    ${ok ? `<p class="hud-k">Quantité</p><div class="qrow"><div class="stepper"><button type="button" data-act="qty-step" data-id="${id}" data-d="-1" aria-label="Un de moins">−</button><input id="qty-${id}" data-qty="${id}" type="number" inputmode="numeric" min="1" max="9999" value="${n}" aria-label="Quantité de ${s.pl}"><button type="button" data-act="qty-step" data-id="${id}" data-d="1" aria-label="Un de plus">+</button></div><div class="quick"><button type="button" class="chipbtn" data-act="qty-set" data-id="${id}" data-v="10">×10</button><button type="button" class="chipbtn" data-act="qty-set" data-id="${id}" data-v="max">Max</button></div></div>` : ''}
    <div id="sf-${id}" style="display:contents">${shipFoot(id)}</div>`;
}
function chipx(kind, id, col, label, a, b, more) {
  return `<button class="chipx" data-act="activity" style="--c:var(--${col})"><span class="cth">${thumbImg(kind, id)}</span><span class="cl">${esc(label)}</span><b data-short="${b}"></b>${more > 0 ? `<span class="muted">+${more}</span>` : ''}<span class="cbar"><i data-prog="${a},${b}"></i></span></button>`;
}
function renderStrip() {
  const b = st.q.build[0], r = st.q.research[0], y = st.q.yard[0], parts = [];
  if (threatVisible()) parts.push(`<button class="chipx raid" data-act="activity"><span class="dot"></span>Raid <b data-short="${st.raid.at}"></b></button>`);
  if (b) parts.push(chipx('mod', b.id, MOD[b.id].color, `${MOD[b.id].name} ${b.lvl}`, b.start, b.end, st.q.build.length - 1));
  if (r) parts.push(chipx('tech', r.id, TECH[r.id].color, `${TECH[r.id].name} ${r.lvl}`, r.start, r.end, st.q.research.length - 1));
  if (y) { const s0 = y.start + y.done * y.each; parts.push(chipx('ship', y.id, SHIP[y.id].color, `${SHIP[y.id].pl} ${y.done}/${y.n}`, s0, s0 + y.each, st.q.yard.length - 1)); }
  if (st.fleets.length) parts.push(`<button class="chipx" data-act="activity" style="--c:var(--energy)">${svg('lancer')}<span class="cl">${st.fleets.length} en vol</span></button>`);
  $('#strip').innerHTML = parts.join('');
}
function renderDock() {
  const cur = tab === 'fleets' ? 'sector' : tab;
  const unread = st.log.filter(e => e.t > (st.seenLog || 0)).length;
  const badge = id => {
    if (id === 'station' && st.q.build.length) return `<span class="bd">${st.q.build.length}</span>`;
    if (id === 'research' && st.q.research.length) return `<span class="bd">${st.q.research.length}</span>`;
    if (id === 'yard' && st.q.yard.length) return `<span class="bd">${st.q.yard.length}</span>`;
    if (id === 'sector' && threatVisible()) return '<span class="bd red">!</span>';
    if (id === 'sector' && st.fleets.length) return `<span class="bd">${st.fleets.length}</span>`;
    if (id === 'journal' && unread && cur !== 'journal') return `<span class="bd new">${unread > 9 ? '9+' : unread}</span>`;
    return '';
  };
  $('#dock').innerHTML = TABS.map(t => `<button class="dk" data-act="tab" data-id="${t.id}"${t.id === cur ? ' aria-current="page"' : ''}><span class="dki">${svg(t.icon)}</span><span>${t.label}</span>${badge(t.id)}</button>`).join('');
}
let lastViewKey = '';
function renderView(force) {
  const v = $('#view'); const a = document.activeElement;
  if (!force && (pointerDown || (a && v.contains(a) && a.tagName === 'INPUT'))) { pendingView = true; return; }
  pendingView = false;
  v.innerHTML = (VIEWS[tab] || VIEWS.station)();
  const key = tab + '|' + seg.station + seg.sector + seg.journal;
  if (key !== lastViewKey) {
    lastViewKey = key; v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
    clearTimeout(renderView.t); renderView.t = setTimeout(() => v.classList.remove('enter'), 900);
  }
  paintThumbs();
}
function updateDynamic() {
  const now = Date.now(), r = rates();
  for (const k of ['ore', 'ice']) {
    setText('v-' + k, fmtHud(st.res[k]));
    const f = st.res[k] / r.store, m = document.getElementById('m-' + k), el = document.getElementById('r-' + k);
    if (m) m.style.width = clamp01(f) * 100 + '%';
    if (el) el.classList.toggle('full', f >= 0.999);
  }
  setText('v-data', fmtHud(st.res.data));
  const net = r.eProd - r.eCons;
  setText('v-energy', (net >= 0 ? '+' : '−') + fmtHud(Math.abs(net)));
  const me = document.getElementById('m-energy'); if (me) me.style.width = (r.eProd > 0 ? clamp01(r.eCons / r.eProd) : 1) * 100 + '%';
  const re = document.getElementById('r-energy'); if (re) re.classList.toggle('warn', r.eff < 1);
  setText('v-pop', fmtHud(st.pop));
  const mp = document.getElementById('m-pop'); if (mp) mp.style.width = clamp01(st.pop / r.cap) * 100 + '%';
  const rp = document.getElementById('r-pop'); if (rp) rp.classList.toggle('warn', r.staff < 1);
  floaters(r);
  const al = document.getElementById('alerts'); if (al) { const h = alertsHtml(r); if (al._h !== h) { al.innerHTML = h; al._h = h; } }
  if (modalKind === 'res') { const s = $('#sheet'), h = resSheet(r); if (s._h !== h) { s.innerHTML = h; s._h = h; } }
  for (const el of $$('[data-eta]')) setText2(el, fmtDur(+el.dataset.eta - now));
  for (const el of $$('[data-short]')) setText2(el, fmtShort(+el.dataset.short - now));
  for (const el of $$('[data-prog]')) { const [a, b] = el.dataset.prog.split(',').map(Number); el.style.width = clamp01((now - a) / (b - a)) * 100 + '%'; }
  for (const el of $$('[data-ring]')) { const [a, b] = el.dataset.ring.split(',').map(Number); el.style.strokeDashoffset = String(100 - 100 * clamp01((now - a) / (b - a))); }
  for (const el of $$('.cost[data-k],.cm[data-k]')) el.classList.toggle('short', getRes(el.dataset.k) < +el.dataset.v - 1e-9);
  for (const el of $$('.cb[data-k]')) {
    const v = +el.dataset.v, have = getRes(el.dataset.k), hb = el.querySelector('.cb-have'), bi = el.querySelector('.cb-bar i'), t = fmt(have);
    el.classList.toggle('short', have < v - 1e-9);
    if (hb && hb.textContent !== t) hb.textContent = t;
    if (bi) bi.style.width = clamp01(have / v) * 100 + '%';
  }
  for (const b of $$('button[data-need]')) if (!b.dataset.block) b.disabled = !afford(parseCost(b.dataset.need));
  for (const b of $$('button.up[data-need]')) {
    if (b.dataset.block) continue;
    const c = parseCost(b.dataset.need), ok = afford(c), l = b.querySelector('.up-l'), t = b.querySelector('.up-t');
    const w = ok ? '' : waitShort(c, r), lt = ok ? b.dataset.verb : (/^\d/.test(w) ? 'Dans' : 'Bloqué'), tt = ok ? b.dataset.dur : w;
    b.classList.toggle('go', ok);
    if (l && l.textContent !== lt) l.textContent = lt;
    if (t && t.textContent !== tt) t.textContent = tt;
  }
  for (const el of $$('[data-wait]')) setText2(el, waitText(parseCost(el.dataset.wait), r));
  for (const el of $$('.fdot')) {
    const f = st.fleets.find(x => x.id === +el.dataset.f); if (!f) continue;
    const c = st.map[f.k], [tx, ty] = hexXY(c.q, c.r);
    const p = f.phase === 'out' ? clamp01((now - f.depart) / (f.arrive - f.depart)) : f.p0 * (1 - clamp01((now - f.bs) / (f.back - f.bs)));
    el.style.transform = `translate(${(tx * p).toFixed(1)}px,${(ty * p).toFixed(1)}px)`;
  }
}

/* ================= interactions ================= */
function act(fn) { advanceTo(Date.now()); const r = fn(); bump(); checkQuests(); flush(true); scheduleSave(); return r; }
function setTab(id) {
  if (!VIEWS[id]) return;
  tab = id; try { localStorage.setItem(LS_TAB, id); } catch (e) { /* ignoré */ }
  renderDock(); renderView(true); updateDynamic();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
const release = () => setTimeout(() => { pointerDown = false; if (dirty || pendingView) flush(); }, 60);
document.addEventListener('pointerup', release, true);
document.addEventListener('pointercancel', release, true);
document.addEventListener('click', e => {
  const modal = $('#modal');
  if (e.target === modal && modalKind && modalKind !== 'welcome') { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': setTab(id); break;
    case 'item': openItem(el.dataset.kind, id); break;
    case 'seg': seg[el.dataset.k] = el.dataset.v; renderView(true); updateDynamic(); break;
    case 'activity': openActivity(); break;
    case 'quest-go': goQuest(); break;
    case 'cel-close': closeCel(); break;
    case 'res': openRes(); break;
    case 'ships1': { const n0 = st.q.yard.length; act(() => doShips(id, 1)); if (st.q.yard.length > n0) fxLaunch('ship', id); } break;
    case 'build': { const n0 = st.q.build.length; act(() => doBuild(id)); if (st.q.build.length > n0) fxLaunch('mod', id); } break;
    case 'cancel-build': act(() => { st.q.build = cancelQueue(st.q.build, +el.dataset.i, 'build'); }); break;
    case 'research': { const n0 = st.q.research.length; act(() => doResearch(id)); if (st.q.research.length > n0) fxLaunch('tech', id); } break;
    case 'cancel-research': act(() => { st.q.research = cancelQueue(st.q.research, +el.dataset.i, 'research'); }); break;
    case 'ships': { const n0 = st.q.yard.length; act(() => doShips(id, qty[id] || 1)); if (st.q.yard.length > n0) fxLaunch('ship', id); } break;
    case 'cancel-yard': act(() => cancelYard(+el.dataset.i)); break;
    case 'qty-step': qty[id] = clampInt((qty[id] || 1) + (+el.dataset.d), 1, 9999); refreshShipCard(id, true); break;
    case 'qty-set': qty[id] = el.dataset.v === 'max' ? Math.max(1, maxAfford(id)) : clampInt(el.dataset.v, 1, 9999); refreshShipCard(id, true); break;
    case 'cell': openCell(el.dataset.k); break;
    case 'mission': openFleet(el.dataset.k, el.dataset.m); break;
    case 'fc-step': if (fc) { fc.sel[id] = clampInt((fc.sel[id] || 0) + (+el.dataset.d), 0, st.ships[id] || 0); refreshFc(true); } break;
    case 'fc-max': if (fc) { fc.sel[id] = st.ships[id] || 0; refreshFc(true); } break;
    case 'launch': if (fc) act(() => { if (launch()) closeModal(); }); break;
    case 'recall': act(() => recall(+id)); break;
    case 'settings': openSettings(); break;
    case 'close': closeModal(); break;
    case 'found': {
      const name = ($('#w-name') || {}).value; const sp = +(($('input[name="w-speed"]:checked') || {}).value || 4);
      closeModal(); act(() => found(name, sp)); saveNow(); break;
    }
    case 'save-settings': {
      const name = (($('#s-name') || {}).value || '').trim(); const sp = +(($('input[name="s-speed"]:checked') || {}).value || st.speed);
      const snd = !!(($('#s-sound') || {}).checked); act(() => { st.sound = snd; if (name) st.name = name.slice(0, 24); if (sp !== st.speed) { st.speed = sp; log('info', `Vitesse du temps réglée sur ×${sp}.`); } });
      closeModal(); break;
    }
    case 'reset-ask': $('#dz').innerHTML = `<p style="font-size:13.5px">Toute la progression de ${esc(st.name)} sera effacée.</p><div class="sheet-actions"><button class="btn" data-act="reset-no">Garder ma partie</button><button class="btn danger" data-act="reset-yes">Tout effacer</button></div>`; break;
    case 'reset-no': $('#dz').innerHTML = '<button class="btn danger block" data-act="reset-ask">Recommencer une partie</button>'; break;
    case 'reset-yes': {
      closeModal(); st = newGame(); sel = null; tab = 'station';
      try { localStorage.removeItem(LS_SAVE); } catch (e) { /* ignoré */ }
      renderAll(true); openWelcome(); break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalKind && modalKind !== 'welcome') { closeModal(); return; }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t instanceof SVGElement && t.dataset && t.dataset.act) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.qty) { qty[t.dataset.qty] = clampInt(t.value || 1, 1, 9999); refreshShipCard(t.dataset.qty, false); }
  if (t.dataset && t.dataset.fc && fc) { fc.sel[t.dataset.fc] = clampInt(t.value || 0, 0, st.ships[t.dataset.fc] || 0); refreshFc(false); }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset && t.dataset.qty) t.value = qty[t.dataset.qty] || 1;
  if (t.dataset && t.dataset.fc && fc) t.value = fc.sel[t.dataset.fc] || 0;
});
const persist = () => { if (st && st.founded) { advanceTo(Date.now()); saveNow(); } };
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persist(); else tick(); });

/* ================= boucle ================= */
function tick() {
  if (!st) return;
  const v0 = ver;
  advanceTo(Date.now());
  checkQuests();
  const th = threatVisible();
  if (th !== threatShown) { threatShown = th; dirty = true; if (th && live && st.raid) toast(`Raid corsaire détecté : ${listText(st.raid.comp, PIRATE)}. Arrivée dans ${fmtDur(st.raid.at - Date.now())}.`, 'raid'); }
  if (ver !== v0) scheduleSave();
  if (dirty || pendingView) flush(); else updateDynamic();
  if (st.won && !st.wonSeen && !modalKind) openVictory();
}
function catchUp(report) {
  const from = st.t, now = Date.now();
  if (now - st.t > 30 * 24 * HOUR) st.t = now - 30 * 24 * HOUR;
  live = false; awayLog = [];
  advanceTo(now); checkQuests();
  const items = awayLog; awayLog = null; live = true;
  threatShown = threatVisible();
  if (report && st.founded && now - from > 2 * MIN && items.length && !modalKind) openAway(now - from, items);
}

/* ================= étoile ================= */
function initStar() {
  const cv = $('#star'); if (!cv) return; const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const voidHex = getComputedStyle(document.documentElement).getPropertyValue('--void').trim() || '#0b1114';
  const vr = parseInt(voidHex.slice(1, 3), 16), vg = parseInt(voidHex.slice(3, 5), 16), vb = parseInt(voidHex.slice(5, 7), 16);
  const R0 = makeRng(7);
  const cells = Array.from({ length: 30 }, () => ({ a: R0() * 6.283, d: Math.sqrt(R0()), s: (R0() - 0.5) * 0.00005, z: 0.08 + R0() * 0.16, ph: R0() * 6.283 }));
  let W = 0, H = 0, last = 0;
  function resize() { const dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  const lerp = (a, b, t) => a + (b - a) * t;
  function draw(ts) {
    if (!reduce) requestAnimationFrame(draw);
    if (ts - last < 40 && !reduce) return; last = ts;
    if (!W || cv.width === 0) resize();
    const L = st ? lumAt(lvl('beacon')) : 0.12;
    ctx.clearRect(0, 0, W, H);
    const R = Math.max(130, H * 1.3), cx = W - R * 0.38, cy = H * 0.78;
    const core = [255, lerp(150, 238, L), lerp(90, 200, L)].map(Math.round);
    const rim = [lerp(170, 255, L), lerp(40, 130, L), lerp(22, 70, L)].map(Math.round);
    const pulse = reduce ? 0 : Math.sin(ts * 0.0007) * 0.05;
    const glow = ctx.createRadialGradient(cx, cy, R * 0.85, cx, cy, R * (1.6 + L * 0.6));
    glow.addColorStop(0, `rgba(${rim.join(',')},${0.3 + 0.3 * L + pulse})`); glow.addColorStop(1, `rgba(${rim.join(',')},0)`);
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    const disk = ctx.createRadialGradient(cx - R * 0.25, cy - R * 0.32, R * 0.05, cx, cy, R);
    disk.addColorStop(0, `rgb(${core.join(',')})`); disk.addColorStop(0.65, `rgb(${rim.join(',')})`); disk.addColorStop(1, `rgb(${rim.map(v => Math.round(v * 0.5)).join(',')})`);
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = disk; ctx.fill(); ctx.clip();
    for (const c of cells) {
      const a = c.a + (reduce ? 0 : ts * c.s), x = cx + Math.cos(a) * c.d * R * 0.95, y = cy + Math.sin(a) * c.d * R * 0.95;
      const rr = R * c.z * (1 + (reduce ? 0 : 0.18 * Math.sin(ts * 0.0011 + c.ph)));
      const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
      g.addColorStop(0, `rgba(255,232,190,${0.12 + 0.1 * L})`); g.addColorStop(1, 'rgba(255,210,160,0)');
      ctx.fillStyle = g; ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    ctx.restore();
    const fade = ctx.createLinearGradient(0, 0, W, 0);
    fade.addColorStop(0, `rgba(${vr},${vg},${vb},0.96)`); fade.addColorStop(0.45, `rgba(${vr},${vg},${vb},0.72)`); fade.addColorStop(0.8, `rgba(${vr},${vg},${vb},0)`);
    ctx.fillStyle = fade; ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', () => { resize(); if (reduce) draw(performance.now()); });
  resize(); requestAnimationFrame(draw);
}

/* ================= démarrage ================= */
function boot(hot) {
  let s = null, savedAt = 0;
  if (hot && hot.state && hot.state.v === 1) { s = hot.state; savedAt = hot.savedAt || Date.now(); if (hot.tab && VIEWS[hot.tab]) tab = hot.tab; if (hot.sel) sel = hot.sel; }
  else {
    try { const raw = localStorage.getItem(LS_SAVE); if (raw) { const d = JSON.parse(raw); if (d && d.state && d.state.v === 1) { s = d.state; savedAt = d.savedAt || 0; } } } catch (e) { s = null; }
    try { const t = localStorage.getItem(LS_TAB); if (t && VIEWS[t]) tab = t; } catch (e) { /* ignoré */ }
  }
  if (s) { st = migrate(s); lastSavedAt = savedAt; catchUp(!(hot && hot.state)); }
  else st = newGame();
  live = true;
  renderAll(true);
  initStar();
  setInterval(tick, 1000);
  if (!st.founded) openWelcome();
  else if (st.won && !st.wonSeen && !modalKind) openVictory();
  initCloud();
}
const H = window.claude && window.claude.hot;
if (H && typeof H.snapshot === 'function') { try { H.snapshot(() => ({ state: st, savedAt: lastSavedAt, tab, sel })); } catch (e) { /* ignoré */ } }
if (H && typeof H.ready === 'function') H.ready(boot); else boot((H && H.data) || {});
})();
</script>
