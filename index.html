<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Héliarque">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25' r='75%25'%3E%3Cstop offset='0' stop-color='%2300E5FF'/%3E%3Cstop offset='.55' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%230B1B36'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='20' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='32' rx='30' ry='8' fill='none' stroke='%2300E5FF' stroke-width='3' transform='rotate(-20 32 32)'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Héliarque</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jeu de stratégie spatiale par navigateur : bâtissez une station autour d’une étoile mourante.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Mise en page mobile d’abord : bandeau de la station, HUD collant, illustration propre à chaque section, une colonne de cartes, dock en bas. Palette fournie : bleu nuit, acier, bleu vif et cyan ; vert, ambre, rouge et violet pour les états. Thème sombre unique, par choix. */
  --void:#0B0F16;
  --sky:#0F1E2E;
  --hud:#0B1521;
  --card:#0F1E2E;
  --card-2:#152A42;
  --card-3:#1F3B5B;
  --line:#1F3B5B;
  --ink:#E8EEF7;
  --ink-2:#9CA3AF;
  --ink-3:#7A8394;
  --vesper:#3B82F6;
  --vesper-2:#00E5FF;
  --on-accent:#061322;
  --on-medal:#08111D;
  --ore:#9CA3AF;
  --ice:#00E5FF;
  --data:#A855F7;
  --energy:#F59E0B;
  --pop:#22C55E;
  --danger:#EF4444;
  --ok:#22C55E;
  --star:rgba(255,255,255,.6);
  --hl:rgba(255,255,255,.34);
  --shade:rgba(10,8,30,.28);
  --hi:rgba(255,255,255,.05);
  --scrim:rgba(8,10,26,.62);
  --shadow:rgba(4,6,20,.5);
  --f-display:"Exo 2","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px;
  --r-s:15px;
  --dock-h:68px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--void);color:var(--ink)}
body{font-family:var(--f-body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hud)}
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;background-image:radial-gradient(1.3px 1.3px at 8% 12%,var(--star),transparent 70%),radial-gradient(1px 1px at 22% 64%,var(--star),transparent 70%),radial-gradient(1.5px 1.5px at 37% 28%,var(--star),transparent 70%),radial-gradient(1px 1px at 51% 82%,var(--star),transparent 70%),radial-gradient(1.2px 1.2px at 66% 44%,var(--star),transparent 70%),radial-gradient(1px 1px at 79% 9%,var(--star),transparent 70%),radial-gradient(1.4px 1.4px at 91% 71%,var(--star),transparent 70%),radial-gradient(1px 1px at 14% 92%,var(--star),transparent 70%);background-size:320px 380px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;touch-action:manipulation}
input{font:inherit}
.muted{color:var(--ink-3)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--vesper-2);outline-offset:3px}

/* ---------- ciel de Vesper ---------- */
.bridge{position:relative;overflow:hidden}
.bridge canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bridge-in{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:22px 20px;min-height:124px}
.ident{min-width:0}
.brand{font-size:13.5px;font-weight:600;color:var(--vesper-2)}
.station-name{font-size:clamp(32px,8.5vw,48px);line-height:1;margin:6px 0 10px;letter-spacing:-.025em;overflow-wrap:anywhere}
.sub{color:var(--ink-2);font-size:14.5px}
.sub b{color:var(--vesper-2);font-weight:700}
.icon-btn{appearance:none;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--void) 55%,transparent);border:1px solid color-mix(in oklab,var(--ink) 14%,transparent);color:var(--ink);cursor:pointer}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--hud) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hud-in{display:grid;gap:9px;padding-block:10px}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.r{--c:var(--ink-2);min-width:0;display:grid;gap:1px}
.r .top{display:flex;align-items:center;gap:5px;min-width:0}
.ri{width:15px;height:15px;flex:none;color:var(--c);fill:currentColor}
.r .v{font-weight:700;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.full .v{color:var(--energy)}
.r.warn .s{color:var(--danger);font-weight:600}
.meter{height:3px;border-radius:3px;background:var(--card-2);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;width:0;border-radius:3px;background:var(--c);transition:width .8s linear}
.r.nometer .meter{visibility:hidden}
.ticker{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tk{appearance:none;flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--card);border:0;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;--c:var(--ink-2)}
.tk svg{width:16px;height:16px;fill:none;stroke:var(--c);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round;flex:none}
.tk .muted{font-weight:500}
.tk.idle{color:var(--ink-3);font-weight:500;background:color-mix(in oklab,var(--card) 55%,transparent)}
.tk.idle svg{stroke:var(--ink-3)}
.threat{appearance:none;width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;border:0;background:linear-gradient(90deg,color-mix(in oklab,var(--danger) 32%,var(--card)),color-mix(in oklab,var(--danger) 10%,var(--card)));color:var(--ink);font-size:14px;text-align:left;cursor:pointer}
.threat b{margin-left:auto;font-weight:800;white-space:nowrap}
.threat .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--danger);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}

/* ---------- contenu ---------- */
.app{padding-block:24px calc(var(--dock-h) + 40px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:16px;min-width:0}
.view-head h2{font-size:30px;letter-spacing:-.02em}
.view-head p{color:var(--ink-2);margin-top:6px;max-width:58ch}
.note{font-size:14.5px;color:var(--ink-2);background:color-mix(in oklab,var(--vesper) 10%,var(--card));border-radius:var(--r-s);padding:13px 15px}
.empty{color:var(--ink-3);font-size:14.5px}
.panel{background:var(--card);border-radius:var(--r);padding:16px;min-width:0;box-shadow:inset 0 1px 0 var(--hi)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.panel-h h3{font-size:18px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;background:var(--card-2);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.pill.hot{background:color-mix(in oklab,var(--vesper) 24%,var(--card-2));color:var(--vesper-2)}
.jobs{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.job{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;--c:var(--vesper)}
.mini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--c) 24%,var(--card-2))}
.mini svg{width:21px;height:21px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.job-main{min-width:0;display:grid;gap:7px}
.job-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.job-n{font-weight:700;min-width:0;overflow-wrap:anywhere}
.job-n .muted{font-weight:500}
.eta{font-weight:800;font-size:14px;white-space:nowrap}
.eta.muted{color:var(--ink-3);font-weight:500}
.bar{height:7px;border-radius:7px;background:var(--card-3);overflow:hidden;--c:var(--vesper)}
.job .bar,.mcard .bar{--c:inherit}
.bar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,color-mix(in oklab,var(--c) 55%,var(--card)),var(--c))}
.x{appearance:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--card-2);color:var(--ink-3);cursor:pointer;font-size:19px;line-height:1;display:grid;place-items:center}
.x:hover{color:var(--danger)}
.status{display:grid;gap:16px}
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ring-box{display:flex;gap:12px;align-items:center;min-width:0;--c:var(--ink-2)}
.ring-box > div{min-width:0}
.ring{width:56px;height:56px;flex:none}
.ring-bg{fill:none;stroke:var(--card-3);stroke-width:5.5}
.ring-fg{fill:none;stroke:var(--c);stroke-width:5.5;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.ring-box.warn .ring-fg{stroke:var(--danger)}
.ring-k{font-size:13px;color:var(--ink-3)}
.ring-v{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15}
.ring-n{font-size:12.5px;color:var(--ink-2)}
.ring-box.warn .ring-n{color:var(--danger);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;background:var(--card-2);font-size:13.5px;color:var(--ink-2)}
.chip b{color:var(--ink)}

/* ---------- cartes ---------- */
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card{--c:var(--ink-2);position:relative;isolation:isolate;overflow:hidden;background:var(--card);border-radius:var(--r);padding:18px 16px 16px;display:flex;flex-direction:column;gap:13px;min-width:0;box-shadow:inset 0 1px 0 var(--hi),0 16px 32px -20px var(--shadow)}
.card::before{content:"";position:absolute;z-index:-1;top:-100px;left:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--c) 24%,transparent),transparent);pointer-events:none}
.card.locked{background:color-mix(in oklab,var(--card) 72%,var(--void))}
.card.locked::before{opacity:.3}
.card.locked .medal{filter:grayscale(.9) brightness(.75)}
.card.locked .desc,.card.locked .gain{opacity:.7}
.card-top{display:flex;gap:14px;align-items:center}
.card-title{min-width:0;flex:1}
.card h3{font-size:20px;overflow-wrap:anywhere}
.lvl{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.medal{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,color-mix(in oklab,var(--c) 50%,white) 0%,var(--c) 50%,color-mix(in oklab,var(--c) 55%,var(--void)) 100%);box-shadow:0 10px 22px -8px color-mix(in oklab,var(--c) 60%,transparent)}
.medal svg{width:29px;height:29px;fill:none;stroke:var(--on-medal);stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.desc{color:var(--ink-2);font-size:14.5px}
.gain{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;padding:12px 14px;border-radius:var(--r-s);background:color-mix(in oklab,var(--card-2) 82%,transparent)}
.gain .from{color:var(--ink-3);font-weight:700;font-size:15px}
.gain .arrow{color:var(--ink-3)}
.gain .to{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.1;color:color-mix(in oklab,var(--c) 70%,var(--ink))}
.gain .unit{color:var(--ink-2);font-size:14px}
.gain small{flex-basis:100%;color:var(--ink-3);font-size:13px;margin-top:3px}
.done-note{color:var(--ok);font-weight:700}
.req{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-3)}
.req .pill.ok{color:var(--ok)}
.req .pill.no{color:var(--ink);background:color-mix(in oklab,var(--danger) 20%,var(--card-2))}
.price{display:flex;flex-wrap:wrap;gap:6px}
.card .price{margin-top:auto}
.cost,.dur{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:999px;background:var(--card-2);font-size:14px;font-weight:700;color:var(--ink);--c:var(--ink-2)}
.cost.short{color:var(--danger);box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--danger) 50%,transparent)}
.dur{color:var(--ink-2);font-weight:600;--c:var(--ink-3);background:transparent;padding-left:4px}
.wait{font-size:13px;color:var(--ink-3);text-align:center;margin-top:-5px}
.wait:empty{display:none}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;gap:5px;align-items:baseline;padding:5px 12px;border-radius:999px;background:var(--card-2);font-size:13px;color:var(--ink-3)}
.stat b{color:var(--ink);font-weight:800}
.qrow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.quick{display:flex;gap:6px}
.chipbtn{appearance:none;flex:1;min-height:42px;padding:0 12px;border-radius:999px;background:var(--card-2);border:0;color:var(--ink-2);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.chipbtn:hover{color:var(--ink);background:var(--card-3)}

/* ---------- boutons et champs ---------- */
.btn{appearance:none;cursor:pointer;border:0;border-radius:999px;background:var(--card-2);color:var(--ink);font-family:var(--f-body);font-weight:800;font-size:15.5px;padding:0 22px;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .12s ease,background .2s ease}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:hover:not(:disabled){background:var(--card-3)}
.btn.primary{background:linear-gradient(135deg,var(--vesper-2),var(--vesper));color:var(--on-accent);box-shadow:0 12px 26px -14px var(--vesper)}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,var(--vesper-2),var(--vesper-2))}
.btn.danger{background:color-mix(in oklab,var(--danger) 18%,var(--card-2));color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.block{width:100%}
.stepper{display:grid;grid-template-columns:50px minmax(0,1fr) 50px;border-radius:999px;background:var(--card-2);overflow:hidden}
.stepper button{appearance:none;min-height:48px;background:transparent;border:0;color:var(--ink);font-size:23px;cursor:pointer}
.stepper button:active{background:var(--card-3)}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--f-body);font-weight:800;font-size:18px;color:var(--ink);min-width:0;width:100%;-moz-appearance:textfield;appearance:textfield}
.stepper.sm{grid-template-columns:38px 40px 38px}
.stepper.sm button{min-height:40px;font-size:20px}
.stepper.sm input{font-size:16px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field{display:grid;gap:7px;font-size:14px;color:var(--ink-2)}
.field input{background:var(--card);border:2px solid transparent;border-radius:var(--r-s);color:var(--ink);font-size:17px;font-weight:600;padding:12px 14px;min-height:52px;width:100%}
.field input:focus{border-color:var(--vesper);outline:none}

/* ---------- secteur ---------- */
.sector{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.map-wrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,color-mix(in oklab,var(--vesper) 22%,transparent) 0%,transparent 42%),radial-gradient(circle at 18% 82%,color-mix(in oklab,var(--data) 20%,transparent) 0%,transparent 40%),radial-gradient(circle at 86% 14%,color-mix(in oklab,var(--vesper-2) 12%,transparent) 0%,transparent 36%),var(--void)}
.viewhead{display:grid;gap:12px;margin-bottom:16px}
.banner{position:relative;height:150px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--void),var(--card));border:1px solid var(--line)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.banner img:not([src]){visibility:hidden}
.banner-txt{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 12px;background:linear-gradient(180deg,transparent,color-mix(in oklab,var(--void) 88%,transparent))}
.banner-txt h2{font-size:27px;letter-spacing:.01em;text-shadow:0 2px 14px var(--shadow)}
.view-lead{color:var(--ink-2);max-width:60ch}
.card,.panel,.quest-hero{border:1px solid var(--line)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.sec-h h3{font-size:20px}
.sec-h span{font-size:13px;color:var(--ink-3)}
.grid-t{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.tl{appearance:none;border:0;background:none;padding:0;color:var(--ink);text-align:left;cursor:pointer;display:grid;align-content:start;gap:7px;min-width:0;--c:var(--ink-2)}
.thumb{position:relative;display:block;aspect-ratio:1;width:100%;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,var(--card-2),var(--void));border:1px solid var(--line);box-shadow:0 12px 22px -16px var(--shadow)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.thumb img:not([src]){visibility:hidden}
.tl:hover .thumb img{transform:scale(1.05)}
.tl:active .thumb{transform:scale(.97)}
.tl:focus-visible{outline:none}
.tl:focus-visible .thumb{outline:2px solid var(--vesper-2);outline-offset:2px}
.lvb{position:absolute;right:6px;bottom:8px;min-width:28px;height:24px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:color-mix(in oklab,var(--void) 78%,transparent);font-size:13px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 60%,transparent)}
.upb{position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:50%;display:none;place-items:center;background:var(--ok);color:var(--on-accent);box-shadow:0 4px 10px -2px var(--shadow)}
.tl.can .upb{display:grid}
.upb svg{width:13px;height:13px;fill:currentColor}
.qb{position:absolute;left:6px;bottom:8px;padding:2px 8px;border-radius:999px;background:var(--vesper);color:var(--ink);font-size:11.5px;font-weight:800}
.tbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:color-mix(in oklab,var(--void) 70%,transparent)}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vesper),var(--vesper-2))}
.tl.busy .thumb{border-color:var(--vesper-2);box-shadow:0 0 0 1px var(--vesper-2),0 0 20px -4px var(--vesper-2)}
.tl.locked .thumb img{filter:grayscale(.85) brightness(.5)}
.lock{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2)}
.lock svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8}

/* ================= aléatoire ================= */
function mulberry(a) { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return [a, ((t ^ (t >>> 14)) >>> 0) / 4294967296]; }
function makeRng(seed) { let a = seed >>> 0; return () => { const [n, v] = mulberry(a); a = n; return v; }; }
function rnd() { const [n, v] = mulberry(st.rng); st.rng = n; return v; }

/* ================= helpers d’état ================= */
const lvl = id => st.b[id] || 0;
const tech = id => st.tech[id] || 0;
const pendingB = id => lvl(id) + st.q.build.filter(j => j.id === id).length;
const pendingT = id => tech(id) + st.q.research.filter(j => j.id === id).length;
function cost(c) { const o = {}; for (const k in c) { const v = Math.round(c[k]); if (v > 0) o[k] = v; } return o; }
function mulCost(c, n) { const o = {}; for (const k in c) o[k] = c[k] * n; return o; }
function getRes(k) { return k === 'pop' ? st.pop : (st.res[k] || 0); }
function afford(c) { for (const k in c) if (getRes(k) < c[k] - 1e-9) return false; return true; }
function pay(c) { for (const k in c) { if (k === 'pop') st.pop -= c[k]; else { st.res[k] -= c[k]; st.stats.spent += c[k]; } } }
function refund(c) { for (const k in c) { if (k === 'pop') st.pop += c[k]; else { st.res[k] += c[k]; st.stats.spent -= c[k]; } } }
function costAttr(c) { return Object.entries(c).map(([k, v]) => k + ':' + v).join(','); }
function parseCost(s) { const o = {}; if (!s) return o; for (const p of s.split(',')) { const [k, v] = p.split(':'); o[k] = +v; } return o; }
function reqOk(req) { if (!req) return true; for (const k in req.b || {}) if (lvl(k) < req.b[k]) return false; for (const k in req.t || {}) if (tech(k) < req.t[k]) return false; return true; }
function reqHtml(req) {
  if (!req) return '';
  const items = [];
  for (const k in req.b || {}) items.push(`<span class="${lvl(k) >= req.b[k] ? 'r-ok' : 'r-no'}">${esc(MOD[k].name)} ${req.b[k]}</span>`);
  for (const k in req.t || {}) items.push(`<span class="${tech(k) >= req.t[k] ? 'r-ok' : 'r-no'}">${esc(TECH[k].name)} ${req.t[k]}</span>`);
  return `<div class="req"><span>Requiert</span>${items.join('')}</div>`;
}
const staffMul = () => 0.93 ** tech('auto');
const storeCap = () => MOD.depot.store(lvl('depot'));
const protectedAmt = () => 500 + 0.05 * storeCap();
const radarRange = () => 1 + lvl('radar');
const maxOutposts = () => 1 + Math.floor(lvl('radar') / 2);
const lumAt = l => Math.min(1, 0.12 + 0.176 * l);
const warnMsAt = l => (4 + 3 * l) * MIN / st.speed;
const score = () => Math.floor(Math.max(0, st.stats.spent) / 1000);
function outpostYield(c) { const ore = c.outpost === 'ore'; return (ore ? 200 : 150) * (1 + 0.3 * c.d) * (1 + 0.08 * tech(ore ? 'deep' : 'cryo')); }

function rates() {
  const b = st.b, sp = st.speed, sm = staffMul();
  const need = (MOD.drill.staff(b.drill) + MOD.ice.staff(b.ice) + MOD.sail.staff(b.sail) + MOD.lab.staff(b.lab)) * sm;
  const staff = need > 0 ? Math.min(1, st.pop / need) : 1;
  const eProd = MOD.sail.out(b.sail) * staff * (1 + 0.08 * tech('photon'));
  const eCons = MOD.drill.energy(b.drill) + MOD.ice.energy(b.ice) + MOD.lab.energy(b.lab);
  const eff = eCons > 0 ? Math.min(1, eProd / eCons) : 1;
  const k = staff * eff;
  let oOre = 0, oIce = 0;
  for (const key of st.outk) { const c = st.map[key]; if (!c || !c.outpost) continue; const v = outpostYield(c); if (c.outpost === 'ore') oOre += v; else oIce += v; }
  return {
    ore: (30 + MOD.drill.prod(b.drill) * k * (1 + 0.08 * tech('deep')) + oOre) * sp,
    ice: (15 + MOD.ice.prod(b.ice) * k * (1 + 0.08 * tech('cryo')) + oIce) * sp,
    data: MOD.lab.prod(b.lab) * k * sp,
    eProd, eCons, eff, staff, need, cap: MOD.hab.cap(b.hab), store: storeCap(),
  };
}
function sumCost(c) { return (c.ore || 0) + (c.ice || 0) + (c.data || 0) * 3; }
function bTime(c) { return (8 + Math.pow(sumCost(c) / 4, 0.85)) * 1000 * 0.88 ** lvl('works') / st.speed; }
function rTime(c) { return (8 + Math.pow(sumCost(c) / 4, 0.85)) * 1000 / (1 + 0.1 * lvl('lab')) / st.speed; }
function sTime(id) { return (6 + Math.pow(sumCost(SHIP[id].cost) / 5, 0.8)) * 1000 / (1 + 0.2 * Math.max(0, lvl('yard') - 1)) / st.speed; }
function shipCost(id, n) { const c = { ...SHIP[id].cost }; if (SHIP[id].colonists) c.pop = SHIP[id].colonists; return mulCost(c, n); }
function maxAfford(id) { const c = shipCost(id, 1); let m = 9999; for (const k in c) m = Math.min(m, Math.floor(getRes(k) / c[k])); return Math.max(0, m); }
const shipAtk = id => SHIP[id].atk * (1 + 0.1 * tech('plasma'));
const shipHull = id => SHIP[id].hull * (1 + 0.1 * tech('armor'));
const shipSpeed = id => SHIP[id].speed * (1 + 0.1 * tech('ion'));
const shipCargo = id => SHIP[id].cargo * (1 + 0.15 * tech('hold'));
const bastionAtk = () => MOD.bastion.atk(lvl('bastion')) * (1 + 0.1 * tech('plasma'));
const bastionHull = () => MOD.bastion.hull(lvl('bastion')) * (1 + 0.1 * tech('armor'));
function shipName(id, n) { return n > 1 ? SHIP[id].pl : SHIP[id].name; }
function listText(map, defs) { return Object.keys(defs).filter(k => map[k] > 0).map(k => `${fmt(map[k])} ${map[k] > 1 ? defs[k].pl : defs[k].name}`).join(', '); }
function fleetCargo(ships) { let c = 0; for (const k in ships) c += (ships[k] || 0) * shipCargo(k); return c; }
function fleetPower(ships) { let a = 0, h = 0; for (const k in ships) { a += (ships[k] || 0) * shipAtk(k); h += (ships[k] || 0) * shipHull(k); } return { a, h }; }
function compPower(comp) { let a = 0, h = 0; for (const k in comp) { a += comp[k] * PIRATE[k].atk; h += comp[k] * PIRATE[k].hull; } return { a, h }; }
function travelMs(d, ships) { let v = Infinity; for (const k in ships) if (ships[k] > 0) v = Math.min(v, shipSpeed(k)); if (!isFinite(v)) v = 1; return d * 90000 / v / st.speed; }
function gain(c) {
  const cap = storeCap(); let lost = 0;
  for (const k in c) {
    const v = c[k] || 0; if (!v) continue;
    if (k === 'data') { st.res.data += v; continue; }
    const room = Math.max(0, cap - st.res[k]); const add = Math.min(room, v);
    st.res[k] += add; lost += v - add;
  }

/* ================= nouvelle partie ================= */

/* ================= flottes ================= */

/* ================= objectifs ================= */
function checkQuests() {
  if (!st.founded) return;
  for (const q of QUESTS) {
    if (st.quests[q.id] || !q.ok()) continue;
    st.quests[q.id] = st.t;
    const rw = q.reward || {};
    for (const k of ['ore', 'ice', 'data']) if (rw[k]) st.res[k] += rw[k];
    if (rw.ships) for (const k in rw.ships) st.ships[k] = (st.ships[k] || 0) + rw.ships[k];
    log('quest', `Objectif accompli : ${q.title}.${rewardText(rw) ? ' Récompense : ' + rewardText(rw) + '.' : ''}`);
    bump();
  }
}
function rewardText(rw) {
  const p = [];
  for (const k of ['ore', 'ice', 'data']) if (rw[k]) p.push(`+${fmt(rw[k])} ${RES_NAME[k]}`);
  if (rw.ships) for (const k in rw.ships) p.push(`+${rw.ships[k]} ${shipName(k, rw.ships[k])}`);
  return p.join(', ');
}

function saveNow() {

  lastSavedAt = Date.now();

}

  if (!cloud || cloud.timer) return;

}
async function flushCloud() {

    await cloud.ref.set({ v: 1, savedAt: lastSavedAt || Date.now(), json: JSON.stringify(st) });
    saveMode = 'cloud';

    const code = e && e.code;
    if (['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed', 'quota_exceeded', 'transform_error'].includes(code)) { cloud = null; saveMode = 'local'; }
    else if (cloud) cloud.again = true;
  } finally {
    if (cloud) { cloud.busy = false; if (cloud.again) { cloud.again = false; queueCloud(); } }
    updateSaveMode();
  }
}
async function initCloud() {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const ref = db.collection('data/users/' + uid).doc('save');
    const snap = await ref.get();
    cloud = { ref, busy: false, again: false, last: 0, timer: null };
    let remote = null;
    if (snap.exists) { const d = snap.data(); if (d && typeof d.json === 'string') { try { remote = { savedAt: +d.savedAt || 0, state: JSON.parse(d.json) }; } catch (e) { remote = null; } } }
    saveMode = 'cloud';
    if (remote && remote.state && remote.state.v === 1 && remote.state.founded && (!st.founded || remote.savedAt > lastSavedAt)) adopt(remote.state, remote.savedAt);
    else if (st.founded && (!remote || lastSavedAt > remote.savedAt)) flushCloud();
    updateSaveMode();
  } catch (e) { cloud = null; }
}

  const c = st.map[fc.k];
  const rows = SHIP_ORDER.filter(id => (st.ships[id] || 0) > 0).map(id => `<div class="fc-row" style="--c:var(--${SHIP[id].color})">${medal(SHIP[id].icon)}<div class="fc-n"><b>${SHIP[id].name}</b><span class="muted">${fmt(st.ships[id])} à quai</span></div><div class="stepper sm"><button type="button" data-act="fc-step" data-id="${id}" data-d="-1" aria-label="Retirer un ${SHIP[id].name}">−</button><input id="fc-${id}" data-fc="${id}" type="number" inputmode="numeric" min="0" max="${st.ships[id]}" value="${fc.sel[id] || 0}" aria-label="Nombre de ${SHIP[id].pl}"><button type="button" data-act="fc-step" data-id="${id}" data-d="1" aria-label="Ajouter un ${SHIP[id].name}">+</button></div><button type="button" class="chipbtn" data-act="fc-max" data-id="${id}">Max</button></div>`).join('');
  return `<div class="cell-top"><svg viewBox="-32 -32 64 64" class="cell-art" aria-hidden="true">${bodyGlyph(c, visible(c))}</svg><div class="sheet-h"><p class="eyebrow">${MISSION[fc.m].name} · ${c.d} saut${c.d > 1 ? 's' : ''}</p><h2>${esc(cellTitle(c))}</h2></div></div>
    ${rows ? `<div class="fc-rows">${rows}</div>` : '<p class="empty">Aucun vaisseau à quai.</p>'}
    <div class="fc-sum" id="fc-sum"></div>
    <div class="sheet-actions"><button class="btn" data-act="close">Annuler</button><button class="btn primary" id="fc-go" data-act="launch">Lancer</button></div>`;
}
function openFleet(k, m) {
  advanceTo(Date.now());
  const n = id => st.ships[id] || 0; const s = {};
  if (m === 'explore') { if (n('scout')) s.scout = 1; }
  else if (m === 'extract' || m === 'salvage') { if (n('drone')) s.drone = n('drone'); if (n('hauler')) s.hauler = n('hauler'); }
  else if (m === 'attack') { for (const id of ARMED) if (n(id)) s[id] = n(id); }
  else if (m === 'outpost') { if (n('seed')) s.seed = 1; }
  fc = { k, m, sel: s };
  openModal('fleet', fleetSheet());
  refreshFc(true);
}
function refreshFc(setInputs) {
  if (!fc) return;
  if (setInputs) for (const id in st.ships) { const el = document.getElementById('fc-' + id); if (el) el.value = fc.sel[id] || 0; }
  const c = st.map[fc.k], s = fc.sel, chk = fcCheck();
  const any = Object.values(s).some(v => v > 0);
  const dur = any ? travelMs(c.d, s) : 0, p = fleetPower(s);
  const lines = [];
  if (any) {
    lines.push(`Trajet de <b>${fmtDur(dur)}</b>, retour vers <b>${clock(Date.now() + dur * 2)}</b>`);
    lines.push(`Soute <b>${fmt(fleetCargo(s))}</b> · feu <b>${fmt(p.a)}</b> · coque <b>${fmt(p.h)}</b>`);
    if (fc.m === 'attack' && c.garrison) { const g = compPower(c.garrison); lines.push(`En face : feu <b>${fmt(g.a)}</b> · coque <b>${fmt(g.h)}</b>`); }
  }
  if (!chk.ok && chk.msg) lines.push(`<span class="bad">${chk.msg}</span>`);
  const sum = $('#fc-sum'); if (sum) sum.innerHTML = lines.map(l => `<span>${l}</span>`).join('') || '<span>Choisissez vos vaisseaux.</span>';
  const go = $('#fc-go'); if (go) go.disabled = !chk.ok;
}
function refreshShipCard(id, setInput) {
  const foot = document.getElementById('sf-' + id); if (!foot) return;
  foot.innerHTML = shipFoot(id);
  if (setInput) { const el = document.getElementById('qty-' + id); if (el) el.value = qty[id] || 1; }
  updateDynamic();
}

/* ================= interactions ================= */
function act(fn) { advanceTo(Date.now()); const r = fn(); bump(); checkQuests(); flush(true); scheduleSave(); return r; }
function setTab(id) {
  if (!VIEWS[id]) return;
  tab = id; try { localStorage.setItem(LS_TAB, id); } catch (e) { /* ignoré */ }
  renderDock(); renderView(true); updateDynamic();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
const release = () => setTimeout(() => { pointerDown = false; if (dirty || pendingView) flush(); }, 60);
document.addEventListener('pointerup', release, true);
document.addEventListener('pointercancel', release, true);
document.addEventListener('click', e => {
  const modal = $('#modal');
  if (e.target === modal && modalKind && modalKind !== 'welcome') { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': setTab(id); break;
    case 'item': openItem(el.dataset.kind, id); break;
    case 'build': act(() => doBuild(id)); break;
    case 'cancel-build': act(() => { st.q.build = cancelQueue(st.q.build, +el.dataset.i, 'build'); }); break;
    case 'research': act(() => doResearch(id)); break;
    case 'cancel-research': act(() => { st.q.research = cancelQueue(st.q.research, +el.dataset.i, 'research'); }); break;
    case 'ships': act(() => doShips(id, qty[id] || 1)); break;
    case 'cancel-yard': act(() => cancelYard(+el.dataset.i)); break;
    case 'qty-step': qty[id] = clampInt((qty[id] || 1) + (+el.dataset.d), 1, 9999); refreshShipCard(id, true); break;
    case 'qty-set': qty[id] = el.dataset.v === 'max' ? Math.max(1, maxAfford(id)) : clampInt(el.dataset.v, 1, 9999); refreshShipCard(id, true); break;
    case 'cell': sel = el.dataset.k; renderView(true); updateDynamic(); { const p = $('.cell-panel'); if (p && window.innerWidth < 980) { const r = p.getBoundingClientRect(); if (r.top > window.innerHeight - 160) p.scrollIntoView({ behavior: 'smooth', block: 'center' }); } } break;
    case 'mission': openFleet(el.dataset.k, el.dataset.m); break;
    case 'fc-step': if (fc) { fc.sel[id] = clampInt((fc.sel[id] || 0) + (+el.dataset.d), 0, st.ships[id] || 0); refreshFc(true); } break;
    case 'fc-max': if (fc) { fc.sel[id] = st.ships[id] || 0; refreshFc(true); } break;
    case 'launch': if (fc) act(() => { if (launch()) closeModal(); }); break;
    case 'recall': act(() => recall(+id)); break;
    case 'settings': openSettings(); break;
    case 'close': closeModal(); break;
    case 'found': {
      const name = ($('#w-name') || {}).value; const sp = +(($('input[name="w-speed"]:checked') || {}).value || 4);
      closeModal(); act(() => found(name, sp)); saveNow(); break;
    }
    case 'save-settings': {
      const name = (($('#s-name') || {}).value || '').trim(); const sp = +(($('input[name="s-speed"]:checked') || {}).value || st.speed);
      act(() => { if (name) st.name = name.slice(0, 24); if (sp !== st.speed) { st.speed = sp; log('info', `Vitesse du temps réglée sur ×${sp}.`); } });
      closeModal(); break;
    }
    case 'reset-ask': $('#dz').innerHTML = `<p style="font-size:13.5px">Toute la progression de ${esc(st.name)} sera effacée.</p><div class="sheet-actions"><button class="btn" data-act="reset-no">Garder ma partie</button><button class="btn danger" data-act="reset-yes">Tout effacer</button></div>`; break;
    case 'reset-no': $('#dz').innerHTML = '<button class="btn danger block" data-act="reset-ask">Recommencer une partie</button>'; break;
    case 'reset-yes': {
      closeModal(); st = newGame(); sel = null; tab = 'station';
      try { localStorage.removeItem(LS_SAVE); } catch (e) { /* ignoré */ }
      renderAll(true); openWelcome(); break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalKind && modalKind !== 'welcome') { closeModal(); return; }
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t instanceof SVGElement && t.dataset && t.dataset.act) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.qty) { qty[t.dataset.qty] = clampInt(t.value || 1, 1, 9999); refreshShipCard(t.dataset.qty, false); }
  if (t.dataset && t.dataset.fc && fc) { fc.sel[t.dataset.fc] = clampInt(t.value || 0, 0, st.ships[t.dataset.fc] || 0); refreshFc(false); }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset && t.dataset.qty) t.value = qty[t.dataset.qty] || 1;
  if (t.dataset && t.dataset.fc && fc) t.value = fc.sel[t.dataset.fc] || 0;
});
const persist = () => { if (st && st.founded) { advanceTo(Date.now()); saveNow(); } };
window.addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persist(); else tick(); });

/* ================= boucle ================= */
function tick() {
  if (!st) return;
  const v0 = ver;
  advanceTo(Date.now());
  checkQuests();
  const th = threatVisible();
  if (th !== threatShown) { threatShown = th; dirty = true; if (th && live && st.raid) toast(`Raid corsaire détecté : ${listText(st.raid.comp, PIRATE)}. Arrivée dans ${fmtDur(st.raid.at - Date.now())}.`, 'raid'); }
  if (ver !== v0) scheduleSave();
  if (dirty || pendingView) flush(); else updateDynamic();
  if (st.won && !st.wonSeen && !modalKind) openVictory();
}
function catchUp(report) {
  const from = st.t, now = Date.now();
  if (now - st.t > 30 * 24 * HOUR) st.t = now - 30 * 24 * HOUR;
  live = false; awayLog = [];
  advanceTo(now); checkQuests();
  const items = awayLog; awayLog = null; live = true;
  threatShown = threatVisible();
  if (report && st.founded && now - from > 2 * MIN && items.length && !modalKind) openAway(now - from, items);
}

/* ================= étoile ================= */
function initStar() {
  const cv = $('#star'); const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const voidHex = getComputedStyle(document.documentElement).getPropertyValue('--void').trim() || '#0b1114';
  const vr = parseInt(voidHex.slice(1, 3), 16), vg = parseInt(voidHex.slice(3, 5), 16), vb = parseInt(voidHex.slice(5, 7), 16);
  const R0 = makeRng(7);
  const cells = Array.from({ length: 30 }, () => ({ a: R0() * 6.283, d: Math.sqrt(R0()), s: (R0() - 0.5) * 0.00005, z: 0.08 + R0() * 0.16, ph: R0() * 6.283 }));
  let W = 0, H = 0, last = 0;
  function resize() { const dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  const lerp = (a, b, t) => a + (b - a) * t;
  function draw(ts) {
    if (!reduce) requestAnimationFrame(draw);
    if (ts - last < 40 && !reduce) return; last = ts;
    if (!W || cv.width === 0) resize();
    const L = st ? lumAt(lvl('beacon')) : 0.12;
    ctx.clearRect(0, 0, W, H);
    const R = Math.max(130, H * 1.3), cx = W - R * 0.38, cy = H * 0.78;
    const core = [255, lerp(150, 238, L), lerp(90, 200, L)].map(Math.round);
    const rim = [lerp(170, 255, L), lerp(40, 130, L), lerp(22, 70, L)].map(Math.round);
    const pulse = reduce ? 0 : Math.sin(ts * 0.0007) * 0.05;
    const glow = ctx.createRadialGradient(cx, cy, R * 0.85, cx, cy, R * (1.6 + L * 0.6));
    glow.addColorStop(0, `rgba(${rim.join(',')},${0.3 + 0.3 * L + pulse})`); glow.addColorStop(1, `rgba(${rim.join(',')},0)`);
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    const disk = ctx.createRadialGradient(cx - R * 0.25, cy - R * 0.32, R * 0.05, cx, cy, R);
    disk.addColorStop(0, `rgb(${core.join(',')})`); disk.addColorStop(0.65, `rgb(${rim.join(',')})`); disk.addColorStop(1, `rgb(${rim.map(v => Math.round(v * 0.5)).join(',')})`);
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = disk; ctx.fill(); ctx.clip();
    for (const c of cells) {
      const a = c.a + (reduce ? 0 : ts * c.s), x = cx + Math.cos(a) * c.d * R * 0.95, y = cy + Math.sin(a) * c.d * R * 0.95;
      const rr = R * c.z * (1 + (reduce ? 0 : 0.18 * Math.sin(ts * 0.0011 + c.ph)));
      const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
      g.addColorStop(0, `rgba(255,232,190,${0.12 + 0.1 * L})`); g.addColorStop(1, 'rgba(255,210,160,0)');
      ctx.fillStyle = g; ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    ctx.restore();
    const fade = ctx.createLinearGradient(0, 0, W, 0);
    fade.addColorStop(0, `rgba(${vr},${vg},${vb},0.96)`); fade.addColorStop(0.45, `rgba(${vr},${vg},${vb},0.72)`); fade.addColorStop(0.8, `rgba(${vr},${vg},${vb},0)`);
    ctx.fillStyle = fade; ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener('resize', () => { resize(); if (reduce) draw(performance.now()); });
  resize(); requestAnimationFrame(draw);
}

/* ================= démarrage ================= */
function boot(hot) {
  let s = null, savedAt = 0;
  if (hot && hot.state && hot.state.v === 1) { s = hot.state; savedAt = hot.savedAt || Date.now(); if (hot.tab && VIEWS[hot.tab]) tab = hot.tab; if (hot.sel) sel = hot.sel; }
  else {
    try { const raw = localStorage.getItem(LS_SAVE); if (raw) { const d = JSON.parse(raw); if (d && d.state && d.state.v === 1) { s = d.state; savedAt = d.savedAt || 0; } } } catch (e) { s = null; }
    try { const t = localStorage.getItem(LS_TAB); if (t && VIEWS[t]) tab = t; } catch (e) { /* ignoré */ }
  }
  if (s) { st = migrate(s); lastSavedAt = savedAt; catchUp(!(hot && hot.state)); }
  else st = newGame();
  live = true;
  renderAll(true);
  initStar();
  setInterval(tick, 1000);
  if (!st.founded) openWelcome();
  else if (st.won && !st.wonSeen && !modalKind) openVictory();
  initCloud();
}
const H = window.claude && window.claude.hot;
if (H && typeof H.snapshot === 'function') { try { H.snapshot(() => ({ state: st, savedAt: lastSavedAt, tab, sel })); } catch (e) { /* ignoré */ } }
if (H && typeof H.ready === 'function') H.ready(boot); else boot((H && H.data) || {});
})();
</script>
